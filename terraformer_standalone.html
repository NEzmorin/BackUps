me=\"absolute left-1/2 top-1/2 mt-8 -translate-x-1/2 w-32 h-1.5 bg-white/15 rounded overflow-hidden\"><div className=\"h-full bg-emerald-300\" style={{ width: g.progress * 100 + '%' }} /></div>\n      )}\n\n      {/* терраформинг */}\n      {g.tf && (\n        <div className=\"absolute left-4 top-[250px] glass rounded-xl px-3 py-2 w-60 text-xs\">\n          <div className=\"text-[10px] uppercase tracking-widest text-emerald-300/80 mb-1\">Тераформинг · {g.tf.name}{g.tf.contract ? ' ★' : ''}</div>\n          <TfRow ok={g.tf.okTemp} label=\"Температура\" val={`${g.tf.temp.toFixed(0)} °C`} target=\"8…30\" />\n          <TfRow ok={g.tf.okAtm} label=\"Атмосфера\" val={g.tf.atm.toFixed(2)} target=\"0.8…1.25\" />\n          <TfRow ok={g.tf.okWater} label=\"Жидкость\" val={`${g.tf.water.toFixed(0)}%`} target=\"25…75\" />\n          <TfRow ok={g.tf.okPlants} label=\"Растения\" val={`🌱${g.tf.g}/6 🌳${g.tf.t}/4 🌿${g.tf.b}/3`} target=\"\" />\n          <TfRow ok={g.tf.bio} label=\"БИОгенератор\" val={g.tf.bio ? 'работает' : 'нет'} target=\"\" />\n          {g.tf.ready && <div className=\"mt-1 text-emerald-300 font-semibold\">✔ Готова к жизни!</div>}\n        </div>\n      )}\n\n      {/* полётная панель */}\n      {f && (\n        <div className=\"absolute left-1/2 -translate-x-1/2 bottom-24 glass rounded-xl px-4 py-2 flex gap-6 items-center text-center\">\n          {f.sysState === 'jump' ? (\n            <div className=\"text-cyan-200\"><div className=\"text-[10px] uppercase tracking-widest\">Гиперпрыжок</div>\n              <div className=\"w-56 h-1.5 bg-white/10 rounded overflow-hidden mt-1\"><div className=\"h-full bg-gradient-to-r from-cyan-300 to-violet-400\" style={{ width: (f.jumpT / f.jumpDur) * 100 + '%' }} /></div>\n              <div className=\"text-xs mt-1\">{Math.max(0, f.jumpDur - f.jumpT).toFixed(0)} с до прибытия</div></div>\n          ) : (\n            <>\n              <Stat label={f.atmo ? 'Скорость м/с' : 'Скорость км/с'} v={fmt(f.speed)} />\n              {f.atmo ? <><Stat label=\"Высота м\" v={fmt(f.alt)} /><Stat label=\"Верт. м/с\" v={fmt(f.vv)} warn={f.vv < -35 && f.alt < 400} /></> : <Stat label={f.boost ? 'Форсаж' : 'Тяга'} v={Math.round(f.throttle * 100) + '%'} />}\n              {f.atmo && <div className={`text-xs ${f.autoland ? 'text-emerald-300' : 'text-slate-400'}`}>T автопосадка<br />{f.autoland ? 'ВКЛ' : 'выкл'}</div>}\n            </>\n          )}\n        </div>\n      )}\n      {f && f.warn && <div className=\"absolute left-1/2 -translate-x-1/2 top-24 text-red-300 font-bold text-lg anim-pulse drop-shadow-[0_0_8px_rgba(255,0,0,.8)]\">⚠ {f.warn}</div>}\n      {f && f.gas > 0 && <div className=\"absolute left-1/2 -translate-x-1/2 top-36 text-orange-200 font-bold text-xl anim-pulse\">☠ ГАЗОВЫЙ ГИГАНТ — {f.gas < 0.3 ? 'КОРАБЛЬ ТРЯСЁТ! ВЫБИРАЙСЯ!' : f.gas < 0.62 ? 'СИЛЬНАЯ ТРЯСКА — ТЯНЕТ ВНИЗ!' : 'ВАС ВТЯГИВАЕТ В ЦЕНТР…'}</div>}\n      {f && f.hole > 0.15 && f.sysState === 'space' && <div className=\"absolute left-1/2 -translate-x-1/2 top-36 text-red-300 font-bold text-lg anim-pulse\">⚫ ГРАВИТАЦИОННАЯ АНОМАЛИЯ — {f.hole > 0.75 ? 'ТЕБЯ ЗАСАСЫВАЕТ!' : 'держись подальше от дыры'}</div>}\n\n      {/* подсказка и хотбар */}\n      {g.hint && <div className=\"absolute left-1/2 -translate-x-1/2 bottom-44 glass rounded-lg px-4 py-1.5 text-sm text-cyan-100\">{g.hint}</div>}\n      {g.mode === 'ground' && g.hotbar.length > 0 && (\n        <div className=\"absolute left-1/2 -translate-x-1/2 bottom-4 flex gap-1.5\">\n          {g.hotbar.map((s, i) => (\n            <div key={s.id} className={`glass rounded-lg w-16 h-16 flex flex-col items-center justify-center relative ${i === g.sel ? 'ring-2 ring-cyan-300 bg-cyan-400/10' : 'opacity-80'}`}>\n              <span className=\"absolute left-1 top-0.5 text-[9px] text-slate-400\">{i + 1}</span>\n              <span className=\"text-2xl leading-none\">{s.icon}</span>\n              <span className=\"text-[8px] leading-tight text-center mt-0.5 px-0.5\">{s.label.slice(0, 14)}</span>\n              {s.count !== undefined && <span className=\"absolute right-1 bottom-0.5 text-[10px] font-bold text-amber-200\">×{s.count}</span>}\n            </div>\n          ))}\n        </div>\n      )}\n\n      {/* тосты */}\n      <div className=\"absolute right-4 bottom-4 flex flex-col gap-1.5 items-end\">\n        {g.toasts.map((t) => (\n          <div key={t.id} className={`anim-in glass rounded-lg px-3 py-1.5 text-sm max-w-md border-l-2 ${t.kind === 'good' ? 'border-emerald-400' : t.kind === 'bad' ? 'border-red-400' : 'border-cyan-400'}`}>{t.text}</div>\n        ))}\n      </div>\n\n      {g.capsule && <div className=\"absolute left-1/2 -translate-x-1/2 top-1/3 glass rounded-xl px-6 py-3 text-lg text-cyan-100 anim-pulse\">🚀 {g.capsule}</div>}\n      {g.mode === 'pilot' && !f?.atmo && f?.sysState === 'space' && (\n        <div className=\"absolute left-4 bottom-4 text-[11px] text-slate-300/80 glass rounded-lg px-3 py-2 leading-relaxed\">\n          Мышь — курс · W/S тяга · A/D/Space/C боком · Shift форсаж · X стоп<br />\n          J — прыжок · M — карта · G — скан · ЛКМ — бур · F — стыковка · E — встать\n        </div>\n      )}\n      {inSeat && f?.atmo && (\n        <div className=\"absolute left-4 bottom-4 text-[11px] text-slate-300/80 glass rounded-lg px-3 py-2 leading-relaxed\">\n          Space — тяга вверх (тормоз) · C — вниз · WASD — горизонталь · Мышь — курс<br />T — автопосадка (Ассистент) · не превышай безопасную скорость!\n        </div>\n      )}\n\n      {/* пауза / клик */}\n      {!g.locked && !g.panel && !g.dead && (\n        <div className=\"absolute inset-0 flex items-center justify-center bg-black/35 pointer-events-auto cursor-pointer\" onClick={() => api.lock()}>\n          <div className=\"glass rounded-2xl px-8 py-5 text-center\"><div className=\"text-xl font-bold\">Нажми, чтобы продолжить</div><div className=\"text-xs text-slate-400 mt-1\">H — управление · Esc — пауза</div>\n            <button className=\"btn mt-3\" onClick={(e) => { e.stopPropagation(); api.menu(); }}>В главное меню</button></div>\n        </div>\n      )}\n      {g.dead && (\n        <div className=\"absolute inset-0 flex items-center justify-center bg-black/70 pointer-events-auto\">\n          <div className=\"glass rounded-2xl px-10 py-8 text-center max-w-md\">\n            <div className=\"text-3xl font-black text-red-400 mb-2\">☠ КОНЕЦ ПОЛЁТА</div>\n            <div className=\"text-slate-200 mb-4\">{g.dead}</div>\n            <button className=\"btn btn-gold text-base px-6 py-2\" onClick={() => api.respawn()}>Вернуться (−12% Спорлингов)</button>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n\nfunction Stat({ label, v, warn }: { label: string; v: string; warn?: boolean }) {\n  return <div><div className=\"text-[10px] uppercase tracking-widest text-slate-400\">{label}</div><div className={`text-2xl font-bold tabular-nums ${warn ? 'text-red-400 anim-pulse' : 'text-cyan-100'}`}>{v}</div></div>;\n}\nfunction TfRow({ ok, label, val, target }: { ok: boolean; label: string; val: string; target: string }) {\n  return (\n    <div className=\"flex justify-between gap-2 py-px\"><span className={ok ? 'text-emerald-300' : 'text-slate-300'}>{ok ? '✔' : '○'} {label}</span><span className=\"text-slate-200 tabular-nums\">{val} <span className=\"text-slate-500\">{target}</span></span></div>\n  );\n}\n", "/src/ui/Panels.tsx": "import { ReactNode, useEffect, useRef } from 'react';\nimport { useGame, api, set, buyItem, buyRes, sellRes, sellPrice, buyPrice, craft, acceptOffer, declineOffer, capacity, resTotal, GS } from '../game/store';\nimport { ITEMS, ItemId, RECIPES, RES, RES_IDS, ResId, SHIP_PARTS, PART_NAMES } from '../game/data';\nimport { SYSTEMS, MARKET_SYS, distLy, jumpCost, findPlanet } from '../game/universe';\nimport { Money, SporlingIcon } from './SporlingIcon';\n\nfunction Frame({ title, icon, children, wide = false }: { title: string; icon?: string; children: ReactNode; wide?: boolean }) {\n  return (\n    <div className=\"fixed inset-0 flex items-center justify-center bg-black/55 backdrop-blur-[2px] pointer-events-auto\" onMouseDown={(e) => e.stopPropagation()}>\n      <div className={`glass rounded-2xl ${wide ? 'w-[960px]' : 'w-[760px]'} max-w-[96vw] max-h-[90vh] flex flex-col anim-in`}>\n        <div className=\"flex items-center justify-between px-5 py-3 border-b border-white/10\">\n          <div className=\"text-lg font-bold tracking-wide\">{icon} {title}</div>\n          <button className=\"btn\" onClick={() => api.closePanel()}>Закрыть · Esc</button>\n        </div>\n        <div className=\"p-4 overflow-auto scroll\">{children}</div>\n      </div>\n    </div>\n  );\n}\n\nconst ResChip = ({ id, n, have }: { id: ResId; n: number; have?: number }) => (\n  <span className={`inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded bg-white/5 ${have !== undefined && have < n ? 'text-red-300' : 'text-slate-200'}`}>{RES[id].icon} {n}{have !== undefined ? <span className=\"text-slate-500\">/{have}</span> : null}</span>\n);\n\nexport function Panels() {\n  const g = useGame();\n  if (g.screen !== 'play' || !g.panel) return null;\n  switch (g.panel) {\n    case 'map': return <MapPanel g={g} />;\n    case 'shop': return <ShopPanel g={g} />;\n    case 'fab': return <FabPanel g={g} />;\n    case 'screen': return <ScreenPanel g={g} />;\n    case 'pda': return <PdaPanel g={g} />;\n    case 'dialog': return <DialogPanel g={g} />;\n    case 'help': return <HelpPanel />;\n  }\n  return null;\n}\n\n// ───────────── карта галактики ─────────────\nfunction MapPanel({ g }: { g: GS }) {\n  const cur = SYSTEMS[g.sysId], sel = g.jumpTarget !== null ? SYSTEMS[g.jumpTarget] : null;\n  const sc = 3.5, cx = 330, cy = 250;\n  const target = g.contract ? findPlanet(g.contract.planetId) : null;\n  const P = (s: typeof cur) => ({ x: cx + s.gx * sc, y: cy + s.gz * sc });\n  const cost = sel ? jumpCost(g.sysId, sel.id) : 0;\n  const canJump = sel && g.shipState === 'space' && g.fuel >= cost && sel.id !== g.sysId;\n  return (\n    <Frame title=\"Звёздная карта\" icon=\"🌌\" wide>\n      <div className=\"flex gap-4\">\n        <svg viewBox=\"0 0 660 500\" className=\"w-[640px] bg-[#04060f] rounded-xl border border-white/10\">\n          <defs><radialGradient id=\"mg\"><stop offset=\"0\" stopColor=\"#1b2a55\" /><stop offset=\"1\" stopColor=\"#04060f\" /></radialGradient></defs>\n          <rect width=\"660\" height=\"500\" fill=\"url(#mg)\" opacity=\".7\" />\n          {[40, 80, 120].map((r) => <circle key={r} cx={cx} cy={cy} r={r * sc * 0.55} fill=\"none\" stroke=\"#1d2a4a\" strokeDasharray=\"3 5\" />)}\n          <circle cx={P(cur).x} cy={P(cur).y} r={(g.fuel / 1.2) * sc} fill=\"rgba(80,200,255,.05)\" stroke=\"#2aa5d6\" strokeDasharray=\"6 6\" opacity=\".7\" />\n          {sel && <line x1={P(cur).x} y1={P(cur).y} x2={P(sel).x} y2={P(sel).y} stroke=\"#7dd3fc\" strokeWidth=\"1.5\" strokeDasharray=\"4 3\" />}\n          {SYSTEMS.map((s) => {\n            const p = P(s), isCur = s.id === g.sysId, isM = s.id === MARKET_SYS, isT = target?.sys === s.id, isSel = sel?.id === s.id;\n            return (\n              <g key={s.id} className=\"cursor-pointer\" onClick={() => set({ jumpTarget: s.id })}>\n                <circle cx={p.x} cy={p.y} r=\"12\" fill=\"transparent\" />\n                {s.star === 'hole' ? <><circle cx={p.x} cy={p.y} r=\"5\" fill=\"#000\" stroke=\"#ff6a3a\" strokeWidth=\"2\" /><circle cx={p.x} cy={p.y} r=\"8\" fill=\"none\" stroke=\"#ff6a3a\" opacity=\".4\" /></>\n                  : <circle cx={p.x} cy={p.y} r={3.5} fill={'#' + s.starColor.toString(16).padStart(6, '0')} />}\n                {isCur && <circle cx={p.x} cy={p.y} r=\"10\" fill=\"none\" stroke=\"#22d3ee\" strokeWidth=\"2\" />}\n                {isSel && <circle cx={p.x} cy={p.y} r=\"13\" fill=\"none\" stroke=\"#fff\" strokeWidth=\"1.5\" />}\n                {isM && <text x={p.x + 8} y={p.y - 8} fontSize=\"15\">🏪</text>}\n                {isT && <text x={p.x - 20} y={p.y - 8} fontSize=\"16\" fill=\"#ffd24a\">★</text>}\n                <text x={p.x + 6} y={p.y + 15} fontSize=\"9\" fill={isCur ? '#67e8f9' : '#8aa0c8'}>{s.name}</text>\n              </g>\n            );\n          })}\n        </svg>\n        <div className=\"flex-1 text-sm flex flex-col gap-3 min-w-[240px]\">\n          <div className=\"text-xs text-slate-400 leading-relaxed\">\n            Ты в системе <b className=\"text-cyan-300\">{cur.name}</b>. Пунктир — дальность по топливу.<br />\n            🏪 Торговый зал · ★ цель заказа · ⚫ чёрная дыра (платят ×10, но смертельно опасно)\n          </div>\n          {sel ? (\n            <div className=\"glass rounded-xl p-3\">\n              <div className=\"text-lg font-bold\">{sel.name} {sel.star === 'hole' && <span className=\"text-red-400\">⚫ Чёрная дыра</span>}</div>\n              {sel.id === MARKET_SYS && <div className=\"text-cyan-300\">🏪 Здесь Торговый зал</div>}\n              {target?.sys === sel.id && <div className=\"text-amber-300\">★ Планета заказа: {target.name}</div>}\n              <div className=\"mt-1 text-slate-300\">Расстояние: <b>{distLy(g.sysId, sel.id).toFixed(1)}</b> св. лет</div>\n              {sel.id !== g.sysId && <div className=\"text-slate-300\">Топливо: <b className={g.fuel < cost ? 'text-red-400' : 'text-emerald-300'}>{cost}</b> (есть {Math.round(g.fuel)})</div>}\n              <button className=\"btn btn-gold mt-3 w-full py-2 text-base\" disabled={!canJump} onClick={() => api.jump(sel.id)}>\n                ⚡ Гиперпрыжок {g.shipState !== 'space' ? '(только в космосе)' : ''}\n              </button>\n            </div>\n          ) : <div className=\"glass rounded-xl p-3 text-slate-400\">Выбери систему на карте.</div>}\n          {g.fuel < 20 && <div className=\"text-xs text-red-300\">Мало топлива — лети к 🏪 Торговому залу.</div>}\n        </div>\n      </div>\n    </Frame>\n  );\n}\n\n// ───────────── магазин ─────────────\nconst TABS: [GS['shopTab'], string][] = [['res', '📦 Ресурсы'], ['tech', '🛰️ Технологии'], ['tf', '🌍 Тераформинг'], ['svc', '⛽ Топливо и ремонт']];\nfunction ShopPanel({ g }: { g: GS }) {\n  const village = g.shopTab === 'village';\n  const free = capacity() - resTotal();\n  return (\n    <Frame title={village ? 'Обмен с жителями' : 'Interstellar Marketplace'} icon={village ? '🏘️' : '🏪'} wide>\n      <div className=\"flex items-center justify-between mb-3\">\n        <div className=\"flex gap-1.5\">\n          {!village && TABS.map(([id, label]) => <button key={id} className={`btn ${g.shopTab === id ? 'btn-gold' : ''}`} onClick={() => set({ shopTab: id })}>{label}</button>)}\n        </div>\n        <div className=\"flex gap-4 items-center text-sm\"><span className=\"text-slate-400\">Хранилище {resTotal()}/{capacity()}</span><Money v={g.money} size={20} /></div>\n      </div>\n      {(g.shopTab === 'res' || village) && (\n        <div className=\"grid grid-cols-2 gap-2\">\n          {RES_IDS.map((id) => (\n            <div key={id} className=\"glass rounded-lg p-2 flex items-center gap-2\">\n              <div className=\"text-2xl w-9 text-center\">{RES[id].icon}</div>\n              <div className=\"flex-1 leading-tight\"><div className=\"font-semibold\">{RES[id].name}</div><div className=\"text-[11px] text-slate-400\">есть {g.res[id]} · продажа <SporlingIcon size={10} /> {sellPrice(id, village ? 1.15 : 1)}{!village && <> · покупка <SporlingIcon size={10} /> {buyPrice(id)}</>}</div></div>\n              <div className=\"flex gap-1\">\n                <button className=\"btn\" disabled={!g.res[id]} onClick={() => sellRes(id, 1, village ? 1.15 : 1)}>−1</button>\n                <button className=\"btn\" disabled={!g.res[id]} onClick={() => sellRes(id, g.res[id], village ? 1.15 : 1)}>Всё</button>\n                {!village && <button className=\"btn btn-gold\" disabled={g.money < buyPrice(id) || free < 1} onClick={() => buyRes(id, 1)}>+1</button>}\n                {!village && <button className=\"btn btn-gold\" disabled={g.money < buyPrice(id) * 10 || free < 10} onClick={() => buyRes(id, 10)}>+10</button>}\n              </div>\n            </div>\n          ))}\n        </div>\n      )}\n      {g.shopTab === 'tech' && <ItemGrid ids={['pda', 'scanner', 'assistant', 'drillmod', 'darkenergy', 'comm', 'backpack', 'drill', 'gun', 'hammer', 'rover', 'fuelcell', 'repair']} g={g} />}\n      {g.shopTab === 'tf' && <ItemGrid ids={['heater', 'cooler', 'atmgen', 'atmdes', 'watergen', 'drier', 'seed_grass', 'seed_tree', 'seed_bush', 'biogen']} g={g} />}\n      {g.shopTab === 'svc' && (\n        <div className=\"grid grid-cols-2 gap-3\">\n          <div className=\"glass rounded-xl p-4\"><div className=\"text-lg font-bold\">⛽ Заправка</div><div className=\"text-sm text-slate-400 mb-2\">3 <SporlingIcon size={11} /> за единицу. Бак: {Math.round(g.fuel)}/{g.maxFuel}</div>\n            <div className=\"flex gap-2 flex-wrap\">\n              {[10, 25].map((n) => <button key={n} className=\"btn btn-gold\" disabled={g.money < n * 3 || g.fuel >= g.maxFuel} onClick={() => set({ fuel: Math.min(g.maxFuel, g.fuel + n), money: g.money - Math.min(n, g.maxFuel - g.fuel) * 3 })}>+{n}</button>)}\n              <button className=\"btn btn-gold\" disabled={g.fuel >= g.maxFuel || g.money < 3} onClick={() => { const n = Math.min(g.maxFuel - g.fuel, Math.floor(g.money / 3)); set({ fuel: g.fuel + n, money: g.money - n * 3 }); }}>Полный бак</button>\n            </div></div>\n          <div className=\"glass rounded-xl p-4\"><div className=\"text-lg font-bold\">🔧 Ремонт корпуса</div><div className=\"text-sm text-slate-400 mb-2\">2 <SporlingIcon size={11} /> за 1%. Корпус: {Math.round(g.hull)}%</div>\n            <div className=\"flex gap-2\">\n              <button className=\"btn btn-gold\" disabled={g.hull >= 100 || g.money < 20} onClick={() => set({ hull: Math.min(100, g.hull + 10), money: g.money - 20 })}>+10%</button>\n              <button className=\"btn btn-gold\" disabled={g.hull >= 100 || g.money < 2} onClick={() => { const n = Math.min(100 - g.hull, Math.floor(g.money / 2)); set({ hull: g.hull + n, money: g.money - n * 2 }); }}>Полный ремонт</button>\n            </div></div>\n          <div className=\"glass rounded-xl p-4 col-span-2 text-sm text-slate-300\">🫁 Кислород в зале пополняется бесплатно. 💡 Совет: продай ресурсы на вкладке «Ресурсы», чтобы получить Спорлинги.</div>\n        </div>\n      )}\n    </Frame>\n  );\n}\nfunction ItemGrid({ ids, g }: { ids: ItemId[]; g: GS }) {\n  return (\n    <div className=\"grid grid-cols-2 gap-2\">\n      {ids.map((id) => {\n        const it = ITEMS[id], own = g.items[id] || 0, uniq = it.kind === 'module' || it.kind === 'tool';\n        return (\n          <div key={id} className=\"glass rounded-lg p-2.5 flex items-center gap-3\">\n            <div className=\"text-3xl w-10 text-center\">{it.icon}</div>\n            <div className=\"flex-1 leading-tight\"><div className=\"font-semibold\">{it.name}{!uniq && own > 0 && <span className=\"text-amber-200\"> ×{own}</span>}</div><div className=\"text-[11px] text-slate-400\">{it.desc}</div></div>\n            <button className={`btn ${uniq && own ? '' : 'btn-gold'}`} disabled={(uniq && own > 0) || g.money < it.price} onClick={() => buyItem(id)}>\n              {uniq && own ? 'Есть ✔' : <><SporlingIcon size={12} /> {it.price}</>}\n            </button>\n          </div>\n        );\n      })}\n    </div>\n  );\n}\n\n// ───────────── изготовитель ─────────────\nfunction FabPanel({ g }: { g: GS }) {\n  return (\n    <Frame title=\"Изготовитель\" icon=\"🛠️\">\n      <div className=\"text-xs text-slate-400 mb-3\">Создавай инструменты из добытых ресурсов. Хранилище: {resTotal()}/{capacity()}</div>\n      <div className=\"flex flex-col gap-2\">\n        {RECIPES.map((r, i) => {\n          const name = r.kind === 'item' ? ITEMS[r.id as ItemId].name : RES[r.id as ResId].name;\n          const icon = r.kind === 'item' ? ITEMS[r.id as ItemId].icon : RES[r.id as ResId].icon;\n          const desc = r.kind === 'item' ? ITEMS[r.id as ItemId].desc : 'Плетёная верёвка из волокна';\n          const owned = r.kind === 'item' && (ITEMS[r.id as ItemId].kind === 'tool' || ITEMS[r.id as ItemId].kind === 'module') && (g.items[r.id as ItemId] || 0) > 0;\n          const ok = Object.entries(r.cost).every(([k, v]) => g.res[k as ResId] >= (v as number));\n          return (\n            <div key={i} className=\"glass rounded-lg p-2.5 flex items-center gap-3\">\n              <div className=\"text-3xl w-10 text-center\">{icon}</div>\n              <div className=\"flex-1\"><div className=\"font-semibold\">{name}</div><div className=\"text-[11px] text-slate-400 mb-1\">{desc}</div>\n                <div className=\"flex gap-1 flex-wrap\">{Object.entries(r.cost).map(([k, v]) => <ResChip key={k} id={k as ResId} n={v as number} have={g.res[k as ResId]} />)}</div></div>\n              <button className=\"btn btn-gold\" disabled={owned || !ok} onClick={() => craft(i)}>{owned ? 'Есть ✔' : 'Создать'}</button>\n            </div>\n          );\n        })}\n      </div>\n    </Frame>\n  );\n}\n\n// ───────────── экран кабины ─────────────\nfunction ScreenPanel({ g }: { g: GS }) {\n  const tabs: [GS['screenTab'], string][] = [['chat', '💬 Чат'], ['ship', '🚀 Корабль'], ['store', '📦 Хранилище']];\n  return (\n    <Frame title=\"Бортовой экран\" icon=\"🖥️\" wide>\n      <div className=\"flex gap-1.5 mb-3\">{tabs.map(([id, l]) => <button key={id} className={`btn ${g.screenTab === id ? 'btn-gold' : ''}`} onClick={() => set({ screenTab: id })}>{l}</button>)}</div>\n      {g.screenTab === 'chat' && <Chat g={g} />}\n      {g.screenTab === 'ship' && <ShipTab g={g} />}\n      {g.screenTab === 'store' && <StoreTab g={g} />}\n    </Frame>\n  );\n}\nfunction Chat({ g }: { g: GS }) {\n  return (\n    <div className=\"grid grid-cols-5 gap-3\">\n      <div className=\"col-span-3 flex flex-col gap-2\">\n        {!g.boarded && <div className=\"text-slate-400 text-sm\">Чат доступен после запуска корабля.</div>}\n        {g.claims.map((id) => {\n          const p = findPlanet(id)!; const c = g.contract && g.contract.planetId === id ? g.contract : null;\n          return (\n            <div key={id} className=\"glass rounded-xl p-3 border border-emerald-400/50\">\n              <div className=\"font-bold text-emerald-300\">✔ Планета «{p.name}» готова к жизни!</div>\n              <div className=\"text-sm text-slate-300 mb-2\">{c ? `Заказчик «${c.client}» ждёт. Награда: ${c.reward} S.` : 'Можно продать колонистам или оставить себе.'}</div>\n              <div className=\"flex gap-2\"><button className=\"btn btn-gold\" onClick={() => api.claim(id, false)}>💰 Сдать заказчику</button><button className=\"btn\" onClick={() => api.claim(id, true)}>🏡 Сделать домом</button></div>\n            </div>\n          );\n        })}\n        {g.contract && (\n          <div className=\"glass rounded-xl p-3 border border-amber-300/40 text-sm\">\n            <div className=\"font-bold text-amber-200\">★ Текущий заказ · {g.contract.client}</div>\n            Планета «{findPlanet(g.contract.planetId)!.name}», система {SYSTEMS[findPlanet(g.contract.planetId)!.sys].name} ({distLy(g.sysId, findPlanet(g.contract.planetId)!.sys).toFixed(1)} св. лет). Награда <Money v={g.contract.reward} size={13} />\n          </div>\n        )}\n        {g.offers.map((o) => {\n          const p = findPlanet(o.planetId)!;\n          return (\n            <div key={o.id} className=\"glass rounded-xl p-3\">\n              <div className=\"font-bold text-cyan-200\">📨 {o.client}</div>\n              <div className=\"text-sm text-slate-300 my-1\">«Просим тераформировать {p.type === 'dead' ? 'мёртвую' : 'выжженную'} планету <b>{p.name}</b> в системе {SYSTEMS[p.sys].name} ({distLy(g.sysId, p.sys).toFixed(1)} св. лет){SYSTEMS[p.sys].star === 'hole' ? ' — ⚫ система чёрной дыры, платим в 10 раз больше!' : '.'}»</div>\n              <div className=\"text-sm mb-2\">Награда <Money v={o.reward} size={13} />{o.advance > 0 && <> · аванс <Money v={o.advance} size={13} /></>}</div>\n              <div className=\"flex gap-2\"><button className=\"btn btn-gold\" disabled={!!g.contract} onClick={() => acceptOffer(o.id)}>Принять</button><button className=\"btn\" onClick={() => declineOffer(o.id)}>Отклонить</button></div>\n            </div>\n          );\n        })}\n        {g.boarded && !g.offers.length && !g.contract && !g.claims.length && <div className=\"text-slate-400 text-sm\">Новых предложений нет. Клиенты скоро выйдут на связь…</div>}\n      </div>\n      <div className=\"col-span-2 flex flex-col gap-1.5 max-h-[55vh] overflow-auto scroll pr-1\">\n        {[...g.messages].reverse().map((m) => (\n          <div key={m.id} className={`rounded-lg px-2.5 py-1.5 text-xs ${m.kind === 'sys' ? 'bg-sky-400/10' : m.kind === 'done' ? 'bg-emerald-400/10' : 'bg-white/5'}`}><div className=\"font-semibold text-slate-300\">{m.from}</div>{m.text}</div>\n        ))}\n      </div>\n    </div>\n  );\n}\nfunction ShipTab({ g }: { g: GS }) {\n  const mods = (Object.keys(ITEMS) as ItemId[]).filter((id) => ITEMS[id].kind === 'module' && g.items[id]);\n  return (\n    <div className=\"grid grid-cols-2 gap-3\">\n      <div className=\"glass rounded-xl p-3 text-sm\">\n        <div className=\"font-bold mb-2\">Состояние корабля</div>\n        <div>Корпус: <b>{Math.round(g.hull)}%</b> · Топливо: <b>{Math.round(g.fuel)}/{g.maxFuel}</b></div>\n        <div className=\"mt-2 grid grid-cols-2 gap-x-3 text-xs\">{SHIP_PARTS.map((p) => <div key={p} className={g.parts.includes(p) ? 'text-emerald-300' : 'text-red-300'}>{g.parts.includes(p) ? '✔' : '✖'} {PART_NAMES[p]}</div>)}</div>\n        <div className=\"mt-3 flex gap-2 flex-wrap\">\n          <button className=\"btn\" disabled={!g.items.fuelcell} onClick={() => api.useConsumable('fuelcell')}>🔋 Топл. ячейка ×{g.items.fuelcell || 0}</button>\n          <button className=\"btn\" disabled={!g.items.repair} onClick={() => api.useConsumable('repair')}>🧰 Ремкомплект ×{g.items.repair || 0}</button>\n          <button className=\"btn btn-gold\" disabled={!g.items.comm} onClick={() => api.sos()}>📶 SOS (топливо)</button>\n        </div>\n        {!g.items.comm && <div className=\"text-[11px] text-slate-500 mt-1\">SOS требует Модуль связи.</div>}\n      </div>\n      <div className=\"glass rounded-xl p-3 text-sm\">\n        <div className=\"font-bold mb-2\">Установленные модули</div>\n        {mods.length ? mods.map((id) => <div key={id} className=\"text-xs mb-1\">{ITEMS[id].icon} <b>{ITEMS[id].name}</b><div className=\"text-slate-400 ml-5\">{ITEMS[id].desc}</div></div>) : <div className=\"text-slate-400 text-xs\">Пока нет. Купи в Торговом зале.</div>}\n      </div>\n    </div>\n  );\n}\nfunction StoreTab({ g }: { g: GS }) {\n  const items = (Object.keys(ITEMS) as ItemId[]).filter((id) => g.items[id]);\n  return (\n    <div>\n      <div className=\"flex justify-between text-sm mb-2\"><span>Вместимость: {resTotal()}/{capacity()}</span><Money v={g.money} /></div>\n      <div className=\"h-1.5 bg-white/10 rounded mb-3 overflow-hidden\"><div className=\"h-full bg-cyan-400\" style={{ width: (resTotal() / capacity()) * 100 + '%' }} /></div>\n      <div className=\"grid grid-cols-4 gap-2\">\n        {RES_IDS.map((id) => <div key={id} className={`glass rounded-lg p-2 text-center ${g.res[id] ? '' : 'opacity-40'}`}><div className=\"text-2xl\">{RES[id].icon}</div><div className=\"text-[11px]\">{RES[id].name}</div><div className=\"font-bold\">{g.res[id]}</div></div>)}\n      </div>\n      <div className=\"mt-4 text-sm font-bold\">Снаряжение</div>\n      <div className=\"flex gap-2 flex-wrap mt-1\">{items.length ? items.map((id) => <span key={id} className=\"glass rounded-lg px-2 py-1 text-xs\">{ITEMS[id].icon} {ITEMS[id].name}{(ITEMS[id].kind === 'device' || ITEMS[id].kind === 'seed' || ITEMS[id].kind === 'consumable') ? ` ×${g.items[id]}` : ''}</span>) : <span className=\"text-slate-400 text-xs\">Пусто</span>}</div>\n    </div>\n  );\n}\n\n// ───────────── КПК ─────────────\nfunction Radar() {\n  const ref = useRef<HTMLCanvasElement>(null);\n  useEffect(() => {\n    const c = ref.current!, x = c.getContext('2d')!;\n    const draw = () => {\n      x.clearRect(0, 0, 240, 240);\n      x.fillStyle = '#031018'; x.beginPath(); x.arc(120, 120, 118, 0, 7); x.fill();\n      x.strokeStyle = '#1b6a8a'; for (const r of [39, 78, 118]) { x.beginPath(); x.arc(120, 120, r, 0, 7); x.stroke(); }\n      x.beginPath(); x.moveTo(120, 2); x.lineTo(120, 238); x.moveTo(2, 120); x.lineTo(238, 120); x.stroke();\n      for (const o of api.getRadar()) {\n        const px = 120 + (o.x / 120) * 118, py = 120 - (o.z / 120) * 118;\n        if (Math.hypot(px - 120, py - 120) > 117) continue;\n        x.fillStyle = o.c; x.beginPath(); x.arc(px, py, o.r, 0, 7); x.fill();\n      }\n      x.fillStyle = '#fff'; x.beginPath(); x.moveTo(120, 112); x.lineTo(115, 126); x.lineTo(125, 126); x.fill();\n    };\n    draw(); const t = setInterval(draw, 200); return () => clearInterval(t);\n  }, []);\n  return <canvas ref={ref} width={240} height={240} className=\"rounded-full border border-cyan-500/40 shadow-[0_0_24px_rgba(34,211,238,.25)]\" />;\n}\nfunction PdaPanel({ g }: { g: GS }) {\n  const info = api.planetInfo();\n  const shops = g.mode === 'market' ? api.getShops() : [];\n  return (\n    <Frame title=\"КПК — планшет-радар\" icon=\"📱\" wide>\n      <div className=\"grid grid-cols-5 gap-4\">\n        <div className=\"col-span-2 flex flex-col items-center gap-2\">\n          {g.mode === 'ground' ? <Radar /> : <div className=\"w-[240px] h-[240px] rounded-full border border-cyan-500/30 flex items-center justify-center text-xs text-slate-500 text-center p-6\">Радар работает на поверхности планеты</div>}\n          <div className=\"text-[11px] text-slate-400 text-center\">🔵 корабль · 🟡 фауна · точки ресурсов видны после сканирования</div>\n        </div>\n        <div className=\"col-span-3 flex flex-col gap-3 text-sm\">\n          <div className=\"glass rounded-xl p-3\">\n            <div className=\"text-[10px] uppercase tracking-widest text-cyan-300/80\">Планета</div>\n            {info ? (\n              <>\n                <div className=\"text-lg font-bold\">{info.name}{info.hole ? ' ⚫' : ''}</div>\n                <div className=\"text-slate-300\">{info.scanned || g.items.scanner ? info.type : 'Тип неизвестен — нужно сканирование'}</div>\n                <div className=\"grid grid-cols-2 text-xs text-slate-300 mt-1\"><span>Атмосфера: {info.atm.toFixed(2)}</span><span>Температура: {info.temp.toFixed(0)} °C</span><span>Жидкость: {info.water.toFixed(0)}%</span><span>Гравитация: {info.gravity.toFixed(1)} м/с²</span></div>\n                {info.scanned ? <div className=\"mt-2 text-xs\"><div className=\"text-slate-400\">Ресурсы:</div><div className=\"flex gap-1 flex-wrap\">{info.res.map((r: { id: ResId; w: number }) => <span key={r.id} className=\"px-1.5 py-0.5 rounded bg-white/5\">{RES[r.id].icon} {RES[r.id].name} <span className=\"text-slate-500\">{'●'.repeat(Math.max(1, Math.min(4, Math.round(r.w * 3))))}</span></span>)}</div>\n                  <div className=\"mt-1 text-slate-300\">Флора: {info.flora ? 'да 🌳' : 'нет'} · Фауна: {info.fauna ? 'да 🦌' : 'нет'} · Руины: {info.ruins ? 'да 🏚️' : 'нет'}</div></div>\n                  : <div className=\"mt-2 text-xs text-amber-200/80\">{g.items.scanner ? 'Нажми G в кресле пилота у планеты для скана.' : 'Нет Модуля Сканирования — купи в Торговом зале.'}</div>}\n              </>\n            ) : <div className=\"text-slate-400 text-xs\">Рядом нет планет. Подлети ближе.</div>}\n          </div>\n          <div className=\"glass rounded-xl p-3 text-xs\">\n            <div className=\"text-[10px] uppercase tracking-widest text-cyan-300/80\">Навигация</div>\n            🏪 Торговый зал: система <b>{SYSTEMS[MARKET_SYS].name}</b>{g.sysId === MARKET_SYS ? ' — вы здесь!' : ` · ${distLy(g.sysId, MARKET_SYS).toFixed(1)} св. лет`}\n            {g.contract && <div className=\"mt-1 text-amber-200\">★ Заказ: «{findPlanet(g.contract.planetId)!.name}» · {SYSTEMS[findPlanet(g.contract.planetId)!.sys].name}</div>}\n          </div>\n          {shops.length > 0 && (\n            <div className=\"glass rounded-xl p-3 text-xs\">\n              <div className=\"text-[10px] uppercase tracking-widest text-cyan-300/80 mb-1\">Магазины зала</div>\n              {shops.map((s) => <div key={s.id} className=\"flex justify-between items-center py-0.5\"><span>{s.name} · {Math.round(s.dist)} м</span><button className={`btn ${g.tracked === s.id ? 'btn-gold' : ''}`} onClick={() => set({ tracked: g.tracked === s.id ? null : s.id })}>{g.tracked === s.id ? 'Отслеживается' : 'Показать'}</button></div>)}\n            </div>\n          )}\n        </div>\n      </div>\n    </Frame>\n  );\n}\n\nfunction DialogPanel({ g }: { g: GS }) {\n  return (\n    <Frame title={g.dialog?.name || 'Житель'} icon=\"🗨️\">\n      <div className=\"text-base mb-4\">«{g.dialog?.text}»</div>\n      <div className=\"flex gap-2\"><button className=\"btn btn-gold\" onClick={() => { set({ shopTab: 'village', dialog: null }); api.openPanel('shop'); }}>Обменять ресурсы</button><button className=\"btn\" onClick={() => api.closePanel()}>Попрощаться</button></div>\n    </Frame>\n  );\n}\n\nfunction HelpPanel() {\n  const rows: [string, string][] = [\n    ['WASD · Shift · Space', 'ходьба · бег · прыжок'], ['Мышь · ЛКМ', 'обзор · добыча / выстрел / поставить'], ['E', 'взаимодействие (подсказка внизу экрана)'],\n    ['1–9 · колесо', 'выбор предмета в хотбаре'], ['R', 'сменить тип постройки (молоток)'], ['V', 'собрать/сложить вездеход'], ['Y', 'вызвать спасательную капсулу'],\n    ['Tab', 'хранилище и снаряжение'], ['P', 'КПК (если куплен)'], ['M', 'звёздная карта (на корабле)'],\n    ['Кресло: мышь', 'курс корабля'], ['Кресло: W/S · X', 'тяга · стоп'], ['Кресло: Shift', 'форсаж (далеко от планет)'], ['Кресло: J', 'гиперпрыжок к выбранной звезде'],\n    ['Кресло: G · F · T', 'скан · стыковка с Торговым залом · автопосадка'], ['Посадка: Space / C', 'тормозить тягой / ускорить снижение'],\n  ];\n  return (\n    <Frame title=\"Управление и советы\" icon=\"⌨️\">\n      <div className=\"grid grid-cols-2 gap-x-6 gap-y-1 text-sm\">{rows.map(([k, v]) => <div key={k} className=\"flex gap-2\"><span className=\"text-cyan-300 font-semibold min-w-[130px]\">{k}</span><span className=\"text-slate-300\">{v}</span></div>)}</div>\n      <div className=\"mt-4 text-xs text-slate-400 leading-relaxed\">\n        • Входя в атмосферу и взлетая, не превышай безопасную скорость — корпус раскалится. Без атмосферы следи за вертикальной скоростью при посадке (до 7 м/с — безопасно).<br />\n        • На мёртвых планетах кислород ограничен — восполняй его на живых планетах, в куполе жизни или в корабле.<br />\n        • Тераформинг: температура → атмосфера → вода → растения → БИОгенератор. Оборудование — в Торговом зале.<br />\n        • Газовые гиганты смертельны. Системы с чёрной дырой — самые дорогие и самые опасные.\n      </div>\n    </Frame>\n  );\n}\n", "/src/ui/SporlingIcon.tsx": "/** Символ Спорлинга — буква S из двух переплетённых колец */\nexport function SporlingIcon({ size = 18, color = '#ffd34d', className = '' }: { size?: number; color?: string; className?: string }) {\n  return (\n    <svg width={size} height={size} viewBox=\"0 0 24 24\" fill=\"none\" stroke={color} strokeWidth=\"2.1\" strokeLinecap=\"square\" className={className} style={{ display: 'inline-block', verticalAlign: '-3px' }}>\n      <path d=\"M12 13 A5 5 0 1 1 17 8\" />\n      <path d=\"M12 11 A5 5 0 1 0 7 16\" />\n      <path d=\"M12 13 L12 11\" strokeWidth=\"1.4\" />\n    </svg>\n  );\n}\nexport const Money = ({ v, size = 16 }: { v: number; size?: number }) => (\n  <span className=\"inline-flex items-center gap-1 font-bold text-amber-200\"><SporlingIcon size={size} />{Math.round(v).toLocaleString('ru-RU')}</span>\n);\n", "/src/ui/StartScreen.tsx": "import { useGame, api } from '../game/store';\nimport { SporlingIcon } from './SporlingIcon';\n\nexport function StartScreen() {\n  const g = useGame();\n  if (g.screen !== 'menu') return null;\n  return (\n    <div className=\"fixed inset-0 flex items-center pointer-events-auto\" style={{ background: 'linear-gradient(90deg, rgba(2,4,12,.95) 0%, rgba(2,4,12,.75) 38%, rgba(2,4,12,0) 62%)' }}>\n      <div className=\"pl-14 max-w-[560px]\">\n        <div className=\"text-[11px] tracking-[.35em] text-cyan-300/80 mb-2\">ОТ ПЕРВОГО ЛИЦА · 3D · ПЕСОЧНИЦА</div>\n        <h1 className=\"text-6xl font-black leading-[0.95] bg-gradient-to-b from-white to-cyan-300 bg-clip-text text-transparent\">ТЕРРА<br />ФОРМЕР</h1>\n        <div className=\"flex items-center gap-2 mt-3 text-amber-200 text-lg font-semibold\"><SporlingIcon size={26} /> Спорлинги · звёздная торговля</div>\n        <p className=\"mt-4 text-slate-300 text-[15px] leading-relaxed\">\n          Проснись на старой ферме. Собери сломанный овальный корабль, найди топливо и взлети. Исследуй звёздные системы, добывай ресурсы,\n          летай в Торговый зал и принимай заказы: разогрей планету, создай атмосферу и океаны, посади леса — и подари людям новый дом.\n        </p>\n        <div className=\"mt-6 flex flex-col gap-2.5 w-[380px]\">\n          <button className=\"rounded-xl py-3.5 text-left px-5 font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 shadow-[0_0_30px_rgba(34,211,238,.35)] transition cursor-pointer\" onClick={() => api.start(false)}>\n            🌾 Начать с фермы<div className=\"text-xs font-normal text-white/80\">Собери корабль из 8 деталей и заправь его</div>\n          </button>\n          <button className=\"rounded-xl py-3 text-left px-5 font-semibold bg-white/10 hover:bg-white/20 border border-white/15 transition cursor-pointer\" onClick={() => api.start(true)}>\n            🚀 Быстрый старт<div className=\"text-xs font-normal text-slate-300\">Корабль готов — сразу в кабину</div>\n          </button>\n        </div>\n        <div className=\"mt-5 text-xs text-slate-400 leading-relaxed\">WASD — ходьба · мышь — обзор · E — действие · ЛКМ — добыча · H — все клавиши<br />Лучше играть на большом экране в полноэкранном режиме.</div>\n      </div>\n    </div>\n  );\n}\n", "/src/utils/cn.ts": "import { clsx, type ClassValue } from \"clsx\";\nimport { twMerge } from \"tailwind-merge\";\n\nexport function cn(...inputs: ClassValue[]) {\n  return twMerge(clsx(inputs));\n}\n"};
  </script>
  <script type="module">
    const boot = document.getElementById('boot');
    const status = document.getElementById('boot-message');
    const showError = (err) => {
      status.innerHTML = '<div class="error">Не удалось запустить игру.\n\n' + String(err && (err.stack || err.message) || err).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</div>';
    };
    try {
      status.textContent = 'Загрузка компилятора…';
      const esbuild = await import('https://unpkg.com/esbuild-wasm@0.25.9/esm/browser.js');
      await esbuild.initialize({ wasmURL: 'https://unpkg.com/esbuild-wasm@0.25.9/esbuild.wasm', worker: false });
      status.textContent = 'Сборка игровых модулей…';
      const files = window.__TERRAFORMER_SOURCES__;
      const norm = (p) => {
        const a=[];
        for (const part of p.split('/')) { if (!part || part==='.') continue; if (part==='..') a.pop(); else a.push(part); }
        return '/' + a.join('/');
      };
      const candidates = (p) => [p, p+'.tsx', p+'.ts', p+'.jsx', p+'.js', p+'/index.tsx', p+'/index.ts', p+'/index.jsx', p+'/index.js'];
      const plugin = {
        name: 'embedded-project-files',
        setup(build) {
          build.onResolve({ filter: /.*/ }, args => {
            if (args.kind === 'entry-point') return { path: '/src/main.tsx', namespace: 'embedded' };
            if (!args.path.startsWith('.') && !args.path.startsWith('/')) return { path: args.path, external: true };
            const base = args.resolveDir || '/';
            const target = norm((args.path.startsWith('/') ? '' : base + '/') + args.path);
            const found = candidates(target).find(x => Object.prototype.hasOwnProperty.call(files, x));
            if (!found) return { errors: [{ text: 'Не найден модуль: ' + args.path + ' (из ' + args.importer + ')' }] };
            return { path: found, namespace: 'embedded' };
          });
          build.onLoad({ filter: /.*/, namespace: 'embedded' }, args => {
            const source = files[args.path];
            if (source == null) return { errors: [{ text: 'Нет содержимого модуля: ' + args.path }] };
            const ext = args.path.split('.').pop();
            return { contents: source, loader: ext === 'tsx' ? 'tsx' : 'ts', resolveDir: args.path.slice(0, args.path.lastIndexOf('/')) || '/' };
          });
        }
      };
      const result = await esbuild.build({
        entryPoints: ['src/main.tsx'], bundle: true, write: false,
        platform: 'browser', format: 'esm', target: ['es2020'],
        jsx: 'automatic', minify: true, treeShaking: true,
        external: ['react','react/jsx-runtime','react-dom/client','three','clsx','tailwind-merge'],
        plugins: [plugin], logLevel: 'silent'
      });
      const js = result.outputFiles.find(f => f.path.endsWith('.js')) || result.outputFiles[0];
      if (!js) throw new Error('Компилятор не вернул JavaScript-файл.');
      status.textContent = 'Запуск игры…';
      const blob = new Blob([js.text], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      await import(url);
      boot.remove();
    } catch (err) {
      showError(err);
    }
  </script>
