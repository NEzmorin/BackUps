    window.__TERRAFORMER_SOURCES__ = {"/src/App.tsx": "import { useEffect, useRef } from 'react';\nimport { Game } from './game/game';\nimport { Hud } from './ui/Hud';\nimport { Panels } from './ui/Panels';\nimport { StartScreen } from './ui/StartScreen';\n\nlet instance: Game | null = null;\n\nexport default function App() {\n  const canvasRef = useRef<HTMLCanvasElement>(null);\n  const markersRef = useRef<HTMLDivElement>(null);\n  useEffect(() => {\n    if (!instance && canvasRef.current && markersRef.current) { instance = new Game(canvasRef.current, markersRef.current); (window as unknown as { __game: Game }).__game = instance; }\n  }, []);\n  return (\n    <div className=\"fixed inset-0 bg-black\">\n      <canvas ref={canvasRef} className=\"absolute inset-0 w-full h-full\" />\n      <div ref={markersRef} className=\"absolute inset-0 pointer-events-none overflow-hidden\" />\n      <Hud />\n      <Panels />\n      <StartScreen />\n    </div>\n  );\n}\n", "/src/game/data.ts": "export type ResId =\n  | 'leather' | 'wood' | 'fiber' | 'meat' | 'rope' | 'teeth'\n  | 'stone' | 'iron' | 'gold' | 'copper' | 'crystal' | 'water';\n\nexport const RES_IDS: ResId[] = [\n  'leather', 'wood', 'fiber', 'meat', 'rope', 'teeth',\n  'stone', 'iron', 'gold', 'copper', 'crystal', 'water',\n];\n\nexport const RES: Record<ResId, { name: string; icon: string; price: number; group: 'org' | 'min'; color: string }> = {\n  leather: { name: 'Кожа', icon: '🟤', price: 12, group: 'org', color: '#a86b3c' },\n  wood: { name: 'Дерево', icon: '🪵', price: 6, group: 'org', color: '#8a5a2b' },\n  fiber: { name: 'Волокно', icon: '🌿', price: 4, group: 'org', color: '#7fc46a' },\n  meat: { name: 'Мясо', icon: '🥩', price: 9, group: 'org', color: '#d9534f' },\n  rope: { name: 'Верёвка', icon: '🪢', price: 10, group: 'org', color: '#d8c08a' },\n  teeth: { name: 'Зубы хищников', icon: '🦷', price: 16, group: 'org', color: '#f1ecd8' },\n  stone: { name: 'Камень', icon: '🪨', price: 3, group: 'min', color: '#9aa0a d: 'consumable' },\n};\n\nexport interface Recipe { id: ItemId | ResId; kind: 'item' | 'res'; cost: Partial<Record<ResId, number>>; out: number; }\nexport const RECIPES: Recipe[] = [\n  { id: 'drill', kind: 'item', out: 1, cost: { iron: 6, copper: 3, crystal: 2 } },\n  { id: 'gun', kind: 'item', out: 1, cost: { iron: 10, copper: 6, crystal: 4, teeth: 2 } },\n  { id: 'hammer', kind: 'item', out: 1, cost: { wood: 4, iron: 4, rope: 2 } },\n  { id: 'backpack', kind: 'item', out: 1, cost: { leather: 12, fiber: 10, rope: 4 } },\n  { id: 'rover', kind: 'item', out: 1, cost: { iron: 20, copper: 10, crystal: 6, leather: 4 } },\n  { id: 'fuelcell', kind: 'item', out: 1, cost: { crystal: 2, water: 3 } },\n  { id: 'repair', kind: 'item', out: 1, cost: { iron: 5, copper: 2 } },\n  { id: 'rope', kind: 'res', out: 1, cost: { fiber: 3 } },\n];\n\nexport type BuildKind = 'house' | 'beacon' | 'dome';\nexport const BUILDS: Record<BuildKind, { name: string; cost: Partial<Record<ResId, number>>; desc: string }> = {\n  house: { name: 'Домик', cost: { wood: 12, stone: 8 }, desc: 'Уютное жильё колониста' },\n  beacon: { name: 'Маяк', cost: { iron: 6, crystal: 2 }, desc: 'Светит и виден издалека' },\n  dome: { name: 'Купол жизни', cost: { copper: 12, iron: 16, stone: 20, crystal: 8 }, desc: 'Воздух внутри, растут трава и деревья' },\n};\n\nexport const SHIP_PARTS = ['heatshield', 'windshield', 'turbine1', 'turbine2', 'turbine3', 'engine', 'screen', 'reactor'] as const;\nexport const PART_NAMES: Record<string, string> = {\n  heatshield: 'Теплозащита', windshield: 'Лобовое стекло', turbine1: 'Турбина №1', turbine2: 'Турбина №2',\n  turbine3: 'Турбина №3', engine: 'Двигатель', screen: 'Электроэкран', reactor: 'Реактор',\n};\n\nexport const TF = { temp: [8, 30] as [number, number], atm: [0.8, 1.25] as [number, number], water: [25, 75] as [number, number], grass: 6, tree: 4, bush: 3 };\n\nexport const PTYPE_NAMES: Record<string, string> = {\n  alive: 'Живая', dead: 'Мёртвая', deadalive: 'Мёртвая (бывш. живая)', gas: 'Газовый гигант', intelligent: 'Обитаемая (разумные расы)',\n};\n\nexport function mulberry32(a: number) {\n  return function () {\n    a |= 0; a = (a + 0x6d2b79f5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nexport function hash3(a: number, b: number, c = 0): number {\n  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  return (h ^ (h >>> 16)) >>> 0;\n}\nexport const fmt = (n: number) => Math.round(n).toLocaleString('ru-RU');\n", "/src/game/farm.ts": "import * as THREE from 'three';\nimport { mulberry32 } from './data';\nimport { box, cyl } from './models';\n\nexport interface Pickup { id: string; label: string; obj: THREE.Group; x: number; y: number; z: number; taken: boolean }\nexport interface Farm {\n  group: THREE.Group; colliders: { x: number; z: number; hx: number; hz: number }[]; pickups: Pickup[];\n  hangar: { x: number; z: number }; spawn: { x: number; z: number }; tick: (t: number) => void; hangarWalls: THREE.Object3D;\n}\n\nconst L = (c: number, e = 0) => new THREE.MeshLambertMaterial({ color: c, emissive: e, flatShading: true });\n\nexport function buildFarm(): Farm {\n  const g = new THREE.Group();\n  const colliders: Farm['colliders'] = [];\n  const pickups: Pickup[] = [];\n  const ticks: ((t: number) => void)[] = [];\n  const wallM = L(0xd9c9a3), woodM = L(0x7a5230), roofM = L(0x9a3d2c), metalM = L(0x8c949c), darkM = L(0x3a3f46);\n\n  const wall = (x: number, z: number, w: number, d: number, h: number, m: THREE.Material) => {\n    box(w, h, d, m, x, h / 2, z, g); colliders.push({ x, z, hx: w / 2, hz: d / 2 });\n  };\n  /** здание с проёмом на стороне +z */\n  const building = (cx: number, cz: number, w: number, d: number, h: number, gap: number, wm: THREE.Material, rm: THREE.Material, roof = true) => {\n t().value as SurfaceWorld | undefined;\n    const g = new THREE.Group();\n    if (sm) { const c = sm.shipMesh.clone(); c.position.set(0, -2.5, 0); c.rotation.set(0, 0, 0); c.visible = true; setShipParts(c, S.getState().parts); g.add(c); }\n    return g;\n  }\n\n  // ───────────────────── кресло пилота ─────────────────────\n  updatePilot(_dt: number, active: boolean) {\n    const sh = this.ship, st = S.getState();\n    if (sh.state === 'space' || sh.state === 'jump') { /* мышь отдана кораблю */ }\n    this.act = { text: 'встать с кресла', fn: () => this.leaveSeat() };\n    if (sh.state === 'space' && this.space.market) {\n      const d = sh.pos.distanceTo(this.space.marketPos);\n      if (d < 1000) this.act = { text: `встать с кресла  ·  [F] стыковка с Торговым залом (${Math.round(d)} км)`, fn: () => this.leaveSeat() };\n    }\n    void active; void st;\n    this.cabin.tick(this.time);\n  }\n  leaveSeat() {\n    const sh = this.ship;\n    if (sh.state === 'atmo') { S.toast('Нельзя покинуть кресло в полёте в атмосфере!', 'bad'); return; }\n    if (sh.state === 'space') sh.throttle = 0;\n    this.enterCabinAt(0, -0.55, 0);\n  }\n\n  // ───────────────────── открытый космос ─────────────────────\n  updateEva(dt: number, active: boolean) {\n    const p = this.pl, K = this.keys, sh = this.ship;\n    if (active) {\n      this.look(1.5);\n      const e = new THREE.Euler(p.pitch, p.yaw, 0, 'YXZ'), q = new THREE.Quaternion().setFromEuler(e);\n      const f = (K.has('KeyW') ? 1 : 0) - (K.has('KeyS') ? 1 : 0), r = (K.has('KeyD') ? 1 : 0) - (K.has('KeyA') ? 1 : 0), u = (K.has('Space') ? 1 : 0) - (K.has('KeyC') ? 1 : 0);\n      const acc = new V(r, u, -f).applyQuaternion(q).multiplyScalar((K.has('ShiftLeft') ? 22 : 9) * dt);\n      p.vel.add(acc);\n    }\n    p.vel.multiplyScalar(1 - 0.35 * dt);\n    p.pos.addScaledVector(p.vel, dt);\n    sh.vel.set(0, 0, 0);\n    const d = p.pos.distanceTo(sh.pos);\n    if (d < 14) this.act = { text: 'вернуться на борт', fn: () => { this.enterCabinAt(0, 1.7, 0); this.space.shipMesh.visible = false; } };\n    else if (d > 150) this.hintMsg = 'Далеко от корабля! Нажми Y — вызвать спасательную капсулу';\n    // ближайшая атмосфера — тянет вниз\n    for (const pv of this.space.planets) {\n      const dd = p.pos.distanceTo(pv.group.position);\n      if (dd < pv.def.radius * 1.3) { p.vel.addScaledVector(pv.group.position.clone().sub(p.pos).normalize(), 6 * dt); if (dd < pv.def.radius * 1.05) { this.die('Вы упали в планету… Нужно было вызвать капсулу.'); return; } }\n    }\n    this.space.shipMesh.position.copy(sh.pos); this.space.shipMesh.quaternion.copy(sh.quat);\n    this.updateDrill(0, false);\n  }\n\n  // ───────────────────── вездеход / капсула / SOS ─────────────────────\n  toggleRover() {\n    if (this.mode !== 'ground') return;\n    if (!S.have('rover')) { S.toast('Нужен портативный вездеход', 'info'); return; }\n    this.rover = !this.rover; S.toast(this.rover ? 'Вездеход собран!' : 'Вездеход сложен', 'info');\n  }\n  callCapsule() {\n    if (this.mode !== 'ground' && this.mode !== 'eva') return;\n    if (this.capsuleT > 0) return;\n    this.capsuleT = 5; S.set({ capsule: 'Спасательная капсула летит к вам…' });\n    S.toast('Капсула вызвана', 'info');\n  }\n  rescueToShip() {\n    if (this.mode !== 'ground' && this.mode !== 'eva') return;\n    this.rover = false; this.space.shipMesh.visible = false;\n    this.enterCabinAt(0, 1.7, 0);\n    S.set({ hp: Math.max(S.getState().hp, 40) }); S.flash('white'); S.toast('Вы на борту корабля', 'good');\n  }\n  sos() {\n    const st = S.getState();\n    if (!S.have('comm')) { S.toast('Нужен Модуль связи', 'info'); return; }\n    if (this.time - st.sosAt < 240) { S.toast('Сигнал SOS уже отправлен — подожди', 'info'); return; }\n    S.set({ sosAt: this.time, fuel: Math.min(st.maxFuel, st.fuel + 30) });\n    S.pushMsg('Служба спасения', 'Сигнал принят! Дрон-заправщик доставил 30 единиц топлива.', 'sys');\n    S.toast('Дрон-заправщик доставил +30 топлива', 'good');\n  }\n  useConsumable(id: ItemId) {\n    const st = S.getState();\n    if ((st.items[id] || 0) < 1) return;\n    if (id === 'fuelcell') { if (st.fuel >= st.maxFuel) { S.toast('Бак полон', 'info'); return; } S.set({ fuel: Math.min(st.maxFuel, st.fuel + 25) }); }\n    if (id === 'repair') { if (st.hull >= 100) { S.toast('Корпус целый', 'info'); return; } S.set({ hull: Math.min(100, st.hull + 30) }); }\n    S.takeItem(id);\n  }\n\n  // ───────────────────── торговый зал ─────────────────────\n  updateMarket(dt: number, active: boolean) {\n    if (active) { this.look(); this.moveFlat(dt, 4.2, this.hall.bounds, this.hall.obstacles); }\n    const it = this.nearItem(this.hall.items);\n    if (it) {\n      if (it.id === 'exit') this.act = { text: it.label, fn: () => this.undock() };\n      else this.act = { text: it.label, fn: () => { S.set({ shopTab: it.id as never }); this.openPanel('shop'); } };\n    }\n    this.hall.tick(this.time);\n    const st = S.getState();\n    if (st.oxygen < 100) S.set({ oxygen: 100 });\n  }\n  shops() {\n    return this.hall.items.filter((i) => i.id !== 'exit').map((i) => ({ id: i.id, name: ({ res: 'Ресурсы', tech: 'Технологии', tf: 'Тераформинг', svc: 'Топливо и ремонт' } as Record<string, string>)[i.id], dist: Math.hypot(this.pl.pos.x - i.x, this.pl.pos.z - i.z) }));\n  }\n\n  // ───────────────────── поверхность ─────────────────────\n  hotbar() {\n    const it = S.getState().items, out: S.HotSlot[] = [{ id: 'hand', label: 'Резак', icon: '🔧' }];\n    for (const id of ['drill', 'gun', 'hammer'] as ItemId[]) if (it[id]) out.push({ id, label: ITEMS[id].name, icon: ITEMS[id].icon });\n    for (const id of Object.keys(ITEMS) as ItemId[]) { const k = ITEMS[id].kind; if ((k === 'device' || k === 'seed') && (it[id] || 0) > 0) out.push({ id, label: ITEMS[id].name, icon: ITEMS[id].icon, count: it[id] }); }\n    return out;\n  }\n\n  updateGround(dt: number, active: boolean) {\n    const surf = this.surf!, p = this.pl, K = this.keys, sh = this.ship, planet = surf.planet;\n    const g = Math.min(planet.gravity, 12);\n    if (active) {\n      this.look();\n      const f = (K.has('KeyW') ? 1 : 0) - (K.has('KeyS') ? 1 : 0), r = (K.has('KeyD') ? 1 : 0) - (K.has('KeyA') ? 1 : 0);\n      const sp = this.rover ? 15 : K.has('ShiftLeft') ? 8.5 : 5.2;\n      let vx = -Math.sin(p.yaw) * f + Math.cos(p.yaw) * r, vz = -Math.cos(p.yaw) * f - Math.sin(p.yaw) * r;\n      const l = Math.hypot(vx, vz); if (l > 1) { vx /= l; vz /= l; }\n      const k = Math.min(1, dt * 10);\n      p.vel.x += (vx * sp - p.vel.x) * k; p.vel.z += (vz * sp - p.vel.z) * k;\n      const gy = surf.heightAt(p.pos.x, p.pos.z);\n      if (K.has('Space') && p.pos.y <= gy + 0.05 && !this.rover) p.vy = 5.2;\n    } else { p.vel.x *= 0.8; p.vel.z *= 0.8; }\n    const ox = p.pos.x, oz = p.pos.z;\n    p.pos.x += p.vel.x * dt; p.pos.z += p.vel.z * dt;\n    surf.collide(p.pos, 0.45);\n    let gy = surf.heightAt(p.pos.x, p.pos.z);\n    if (gy < surf.waterY - 1.6) { p.pos.x = ox; p.pos.z = oz; gy = surf.heightAt(ox, oz); p.vel.x = p.vel.z = 0; }\n    p.vy -= g * dt; p.pos.y += p.vy * dt;\n    if (p.pos.y <= gy) { p.pos.y = gy; if (p.vy < 0) p.vy = 0; }\n    const eye = new V(p.pos.x, p.pos.y + (this.rover ? 2.1 : 1.7), p.pos.z);\n    const dir = new V(0, 0, -1).applyEuler(new THREE.Euler(p.pitch, p.yaw, 0, 'YXZ'));\n    this.groundActions(dt, active, eye, dir);\n    // существа\n    const dmg = surf.update(dt, p.pos.x, p.pos.y, p.pos.z, 0, true, p.pos, !S.getState().dead);\n    if (dmg > 0) { S.set({ hp: Math.max(0, S.getState().hp - dmg) }); S.flash('hit'); this.shake = 0.8; if (S.getState().hp <= 0) this.die('Вас растерзали дикие создания'); }\n    this.roverMesh.visible = this.rover;\n    if (this.rover) { this.roverMesh.position.copy(p.pos); this.roverMesh.rotation.y = p.yaw; if (!this.roverMesh.parent) surf.scene.add(this.roverMesh); }\n    if (surf.farm) surf.farm.tick(this.time);\n    // интеракции\n    const st = S.getState();\n    const cands: { d: number; a: Act }[] = [];\n    const sd = Math.hypot(p.pos.x - sh.sx, p.pos.z - sh.sz);\n    if (surf.farm) {\n      for (const pk of surf.farm.pickups) {\n        if (pk.taken) continue;\n        const d = Math.hypot(p.pos.x - pk.x, p.pos.z - pk.z);\n        if (d < 3) cands.push({ d, a: { text: `взять: ${pk.label}`, fn: () => this.pickup(pk.id, pk.label) } });\n      }\n    }\n    if (sd < 10) {\n      const allOk = SHIP_PARTS.every((x) => st.parts.includes(x));\n      if (!allOk) cands.push({ d: sd - 1, a: { text: st.carried.length ? `установить детали на корабль (${st.carried.length})` : `корабль сломан — собрано ${st.parts.length}/8 деталей`, fn: () => this.installParts() } });\n      else if (!st.refueled) cands.push({ d: sd - 1, a: { text: st.hasFuelCan ? 'заправить корабль' : 'бак пуст — найди канистру в домике на поле', fn: () => this.refuel() } });\n      else cands.push({ d: sd - 1, a: { text: 'войти на борт', fn: () => this.boardOrReturn() } });\n    }\n    const nd = surf.interactNode(p.pos.x, p.pos.z, 3.2);\n    if (nd) cands.push({ d: Math.hypot(p.pos.x - nd.x, p.pos.z - nd.z), a: nd.kind === 'loot' ? { text: 'обыскать ящик', fn: () => this.openLoot(nd) } : { text: `поговорить: ${nd.label}`, fn: () => this.talk(nd) } });\n    if (cands.length) { cands.sort((a, b) => a.d - b.d); this.act = cands[0].a; }\n    if (!this.act && sd > 150 && sd < 1e5 && !surf.farm) this.hintMsg = 'Корабль далеко — Y: спасательная капсула';\n  }\n\n  pickup(id: string, label: string) {\n    const f = this.surf!.farm!; const pk = f.pickups.find((x) => x.id === id); if (!pk) return;\n    pk.taken = true; pk.obj.visible = false;\n    if (id === 'fuel') { S.set({ hasFuelCan: true }); S.toast('Канистра с топливом взята — неси к кораблю', 'good'); }\n    else { const st = S.getState(); S.set({ carried: [...st.carried, id] }); S.toast(`Взято: ${label}`, 'good'); }\n  }\n  installParts() {\n    const st = S.getState();\n    if (!st.carried.length) { S.toast('Найди детали по лучам света: в поле, в сарае, в хижинах, ангаре', 'info'); return; }\n    S.set({ parts: [...st.parts, ...st.carried], carried: [] });\n    this.placeShip();\n    S.toast(`Установлено деталей: ${st.carried.length}. Всего ${st.parts.length + st.carried.length}/8`, 'good');\n    if (st.parts.length + st.carried.length >= 8) S.toast('Корабль собран! Осталось заправить', 'good');\n  }\n  refuel() {\n    const st = S.getState();\n    if (!st.hasFuelCan) { S.toast('Топливо завалялось в домике посреди пшеничного поля', 'info'); return; }\n    S.set({ refueled: true, hasFuelCan: false, fuel: 40 }); S.flash('good'); S.toast('Заправлено! Можно лететь', 'good');\n  }\n  boardOrReturn() { this.boardShip(); }\n\n  openLoot(n: SNode) {\n    const surf = this.surf!;\n    const d = dropsFor('loot'); const parts: string[] = [];\n    for (const [k, v] of Object.entries(d)) { if (!v) continue; const a = S.addRes(k as ResId, v as number); if (a) parts.push(`+${a} ${RES[k as ResId].name}`); }\n    surf.killNode(n); S.toast(parts.join(', ') || 'Пусто', 'good');\n  }\n  talk(n: SNode) {\n    const lines = ['Приветствую, звёздный путник! Здесь давно не видели чужаков.', 'Наша планета щедра. Хочешь обменять что-нибудь?', 'Ты тот самый тераформер? Слухи быстро летают.', 'Осторожнее с хищниками у реки.'];\n    S.set({ dialog: { name: n.label || 'Житель', text: lines[Math.floor(Math.random() * lines.length)] } });\n    this.openPanel('dialog');\n  }\n\n  groundActions(dt: number, active: boolean, eye: THREE.Vector3, dir: THREE.Vector3) {\n    const surf = this.surf!, st = S.getState(), hb = this.hotbar();\n    const sel = Math.min(st.sel, hb.length - 1); if (sel !== st.sel) S.set({ sel });\n    const slot = hb[sel]; this.shootCd -= dt; this.meleeCd -= dt;\n    this.tracerLine.visible = false;\n    let prog = 0;\n    if (!active || !slot) { this.prog = 0; return; }\n    const id = slot.id;\n    if (id === 'hand' || id === 'drill') {\n      const t = surf.target(eye, dir, 4.6);\n      if (t) {\n        this.hintMsg = ` m(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*gnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5;} return s*0.9+0.5; }\n`;\n\nconst planetVS = `varying vec3 vPos; varying vec3 vN;\nvoid main(){ vPos=position; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;\n\nconst planetFS = `${NOISE_GLSL}\nuniform vec3 uSun,uA,uB,uC,uOcean; uniform float uType,uSeed,uSea,uGreen,uTime,uClouds;\nvarying vec3 vPos; varying vec3 vN;\nvoid main(){\n  vec3 p=normalize(vPos);\n  float h=fbm(p*2.4+uSeed);\n  float lat=abs(p.y);\n  vec3 col; float land=1.0;\n  if(uType>2.5&&uType<3.5){\n    float w=p.y*7.0+(fbm(p*vec3(1.5,4.0,1.5)+uSeed+uTime*0.01)-0.5)*3.0;\n    float b=sin(w*3.1)*0.5+0.5; float b2=sin(w*7.3+1.0)*0.5+0.5;\n    col=mix(uA,uB,b); col=mix(col,uC,b2*0.45);\n    float storm=smoothstep(0.62,0.7,fbm(p*3.0+uSeed*2.0)); col=mix(col,uC*1.25,storm*0.5);\n  } else {\n    float sea=uSea;\n    land=smoothstep(sea-0.012,sea+0.015,h);\n    float elev=clamp((h-sea)/0.4,0.0,1.0);\n    vec3 landCol=mix(uB,uC,smoothstep(0.45,1.0,elev)*(uType<1.5||uType>3.5?0.75:1.0));\n    float detail=fbm(p*9.0+uSeed*3.0);\n    landCol*=0.75+0.5*detail;\n    if(uType>0.5&&uType<2.5){ float cr=smoothstep(0.62,0.7,fbm(p*5.0+uSeed*5.0)); landCol*=1.0-0.4*cr; }\n    vec3 green=mix(vec3(0.14,0.42,0.13),vec3(0.3,0.56,0.2),detail);\n    landCol=mix(landCol,green,uGreen*(1.0-smoothstep(0.6,1.0,elev)));\n    vec3 oc=mix(uOcean*0.5,uOcean,smoothstep(sea-0.3,sea,h));\n    col=mix(oc,landCol,land);\n    float ice=smoothstep(0.84,0.94,lat+(detail-0.5)*0.15);\n    if(uType<0.5||uType>3.5||uGreen>0.5) col=mix(col,vec3(0.93,0.97,1.0),ice*0.9);\n  }\n  if(uClouds>0.0){ float c=fbm(p*3.2+vec3(uTime*0.004,0.0,uSeed*1.7)); col=mix(col,vec3(1.0),smoothstep(0.5,0.82,c)*uClouds); }\n  vec3 N=normalize(vN); float d=dot(N,uSun);\n  float lit=smoothstep(-0.12,0.5,d)*0.95+0.05;\n  col*=lit;\n  if(uType>3.5){ float night=1.0-smoothstep(-0.1,0.18,d); float cities=smooth esh;\n  stars: THREE.Points;\n  tunnel: THREE.LineSegments;\n  tunnelMat: THREE.ShaderMaterial;\n  beam: THREE.Line;\n  shipMesh = new THREE.Group();\n  photon: THREE.Sprite | null = null;\n  starLight = new THREE.PointLight(0xffffff, 3, 0, 0);\n  jumpIntensity = 0;\n  jc1 = new THREE.Color(0x2a8bff); jc2 = new THREE.Color(0x9a5aff);\n  time = 0;\n  private astGeo: THREE.BufferGeometry;\n\n  constructor() {\n    this.scene.add(this.root);\n    this.scene.add(new THREE.AmbientLight(0x303848, 0.8));\n    this.scene.add(this.starLight);\n    this.backMat = new THREE.ShaderMaterial({\n      vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,\n      fragmentShader: backFS, side: THREE.BackSide, depthWrite: false, depthTest: false,\n      uniforms: { c1: { value: new THREE.Color(0x2244aa) }, c2: { value: new THREE.Color(0x8833aa) }, uB: { value: 0.22 }, uTime: { value: 0 }, uSeed: { value: 1 } },\n    });\n    this.backdrop = new THREE.Mesh(new THREE.SphereGeometry(4e5, 32, 20), this.backMat);\n    this.backdrop.renderOrder = -10; this.backdrop.frustumCulled = false;\n    this.scene.add(this.backdrop);\n    // звёзды\n    const N = 4000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);\n    const r = mulberry32(77);\n    for (let i = 0; i < N; i++) {\n      const u = r() * 2 - 1, a = r() * 6.283, s = Math.sqrt(1 - u * u);\n      pos.set([s * Math.cos(a) * 3.5e5, u * 3.5e5, s * Math.sin(a) * 3.5e5], i * 3);\n      const t = r(); const c = new THREE.Color().setHSL(t < 0.3 ? 0.6 : t < 0.5 ? 0.1 : 0.0, 0.5, 0.65 + r() * 0.35);\n      col.set([c.r, c.g, c.b], i * 3);\n    }\n    const sg = new THREE.BufferGeometry();\n    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); sg.setAttribute('color', new THREE.BufferAttribute(col, 3));\n    this.stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: 1.8, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false }));\n    this.stars.frustumCulled = false;\n    this.scene.add(this.stars);\n    // туннель гиперпрыжка\n    const M = 2200, bp = new Float32Array(M * 2 * 3), bb = new Float32Array(M * 2 * 3), be = new Float32Array(M * 2), bs = new Float32Array(M * 2), bc = new Float32Array(M * 2);\n    for (let i = 0; i < M; i++) {\n      const a = r() * 6.283, rad = 18 + Math.pow(r(), 0.7) * 520, z = r() * 3000, sp = 900 + r() * 1800, cc = r();\n      for (let k = 0; k < 2; k++) {\n        const j = i * 2 + k;\n        bb.set([Math.cos(a) * rad, Math.sin(a) * rad, z], j * 3); be[j] = k; bs[j] = sp; bc[j] = cc;\n      }\n    }\n    const tg = new THREE.BufferGeometry();\n    tg.setAttribute('position', new THREE.BufferAttribute(bp, 3));\n    tg.setAttribute('aBase', new THREE.BufferAttribute(bb, 3)); tg.setAttribute('aEnd', new THREE.BufferAttribute(be, 1));\n    tg.setAttribute('aSpeed', new THREE.BufferAttribute(bs, 1)); tg.setAttribute('aCol', new THREE.BufferAttribute(bc, 1));\n    this.tunnelMat = new THREE.ShaderMaterial({\n      vertexShader: tunnelVS, fragmentShader: tunnelFS, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,\n      uniforms: { uTime: { value: 0 }, uLen: { value: 160 }, uMul: { value: 1 }, uOp: { value: 0 } },\n    });\n    this.tunnel = new THREE.LineSegments(tg, this.tunnelMat);\n    this.tunnel.frustumCulled = false; this.tunnel.visible = false;\n    this.scene.add(this.tunnel);\n    // луч бура\n    this.beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0x66ffcc }));\n    this.beam.visible = false; this.beam.frustumCulled = false;\n    this.scene.add(this.beam);\n    this.astGeo = new THREE.IcosahedronGeometry(1, 1);\n    const p = this.astGeo.attributes.position;\n    for (let i = 0; i < p.count; i++) { const k = 0.75 + r() * 0.5; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); }\n    this.astGeo.computeVertexNormals();\n    // модель корабля для EVA\n    this.scene.add(this.shipMesh);\n  }\n\n  load(sys: SystemDef) {\n    this.sys = sys;\n    while (this.root.children.length) { const c = this.root.children[0]; this.root.remove(c); }\n    this.planets = []; this.asteroids = []; this.market = null; this.photon = null;\n    this.hole = sys.star === 'hole';\n    // фон\n    const c1 = new THREE.Color().setHSL(sys.nebula[0] / 360, 0.7, 0.45), c2 = new THREE.Color().setHSL(sys.nebula[1] / 360, 0.7, 0.4);\n    this.backMat.uniforms.c1.value = c1; this.backMat.uniforms.c2.value = c2; this.backMat.uniforms.uSeed.value = (sys.seed % 100) / 10;\n    // звезда / дыра\n    if (!this.hole) {\n      const star = new THREE.Mesh(new THREE.SphereGeometry(sys.starSize, 40, 28), new THREE.MeshBasicMaterial({ color: sys.starColor }));\n      this.root.add(star);\n      const tex = glowTexture('rgba(255,255,255,1)');\n      for (const [k, op] of [[4.5, 0.9], [11, 0.35], [26, 0.14]] as const) {\n        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: sys.starColor, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: op }));\n        sp.scale.setScalar(sys.starSize * k); this.root.add(sp);\n      }\n      this.starLight.color.set(sys.starColor); this.starLight.intensity = 3.2;\n    } else {\n      const bh = new THREE.Mesh(new THREE.SphereGeometry(sys.starSize, 40, 28), new THREE.MeshBasicMaterial({ color: 0x000000 }));\n      this.root.add(bh);\n      const dm = new THREE.ShaderMaterial({\n        vertexShader: `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,\n        fragmentShader: diskFS, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,\n        uniforms: { uTime: { value: 0 }, uIn: { value: sys.starSize * 1.3 }, uOut: { value: sys.starSize * 6 } },\n      });\n      const disk = new THREE.Mesh(new THREE.RingGeometry(sys.starSize * 1.3, sys.starSize * 6, 128, 1), dm);\n      disk.rotation.x = Math.PI / 2 - 0.18; this.root.add(disk);\n      this.photon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,210,150,1)', 'rgba(255,120,40,0)', true), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));\n      this.photon.scale.setScalar(sys.starSize * 5); this.root.add(this.photon);\n      this.starLight.color.set(0xff9a50); this.starLight.intensity = 0.8;\n    }\n    this.starPos.set(0, 0, 0);\n    // планеты\n    for (const d of sys.planets) { const v = this.makePlanet(d); this.planets.push(v); this.root.add(v.group); }\n    this.refreshPlanets();\n    // астероиды\n    const types: ResId[] = ['stone', 'stone', 'stone', 'iron', 'iron', 'copper', 'water', 'crystal', 'gold'];\n    for (const f of sys.asteroids) {\n      const r = mulberry32(f.seed);\n      const mesh = new THREE.InstancedMesh(this.astGeo, new THREE.MeshStandardMaterial({ color: 0x8a8480, roughness: 0.95, flatShading: true }), f.count);\n      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();\n      for (let i = 0; i < f.count; i++) {\n        const ang = r() * 6.283, rr = Math.sqrt(r()) * f.rad;\n        const pos = new THREE.Vector3(f.pos[0] + Math.cos(ang) * rr, f.pos[1] + (r() - 0.5) * f.rad * 0.5, f.pos[2] + Math.sin(ang) * rr);\n        const s = 10 + r() * 50;\n        q.setFromEuler(e.set(r() * 6, r() * 6, r() * 6));\n        m.compose(pos, q, new THREE.Vector3(s, s * (0.7 + r() * 0.5), s));\n        mesh.setMatrixAt(i, m);\n        const res = types[Math.floor(r() * types.length)];\n        const col = new THREE.Color(res === 'iron' ? 0x9a9aa8 : res === 'copper' ? 0xa87a60 : res === 'water' ? 0xb8d4e8 : res === 'crystal' ? 0x80d8e8 : res === 'gold' ? 0xc8b060 : 0x8a8480);\n        mesh.setColorAt(i, col);\n        this.asteroids.push({ pos, s, res, hp: s / 8, mesh, i, alive: true });\n      }\n      this.root.add(mesh);\n    }\n    // торговый зал .rim.uniforms.uCol.value as THREE.Color).set(d.colors.atm).lerp(new THREE.Color(0x6fb4ff), tfm);\n    }\n  }\n\n  setJump(on: boolean) { this.tunnel.visible = on; this.root.visible = !on; this.stars.visible = !on; }\n\n  update(dt: number, camPos: THREE.Vector3, camQuat: THREE.Quaternion) {\n    this.time += dt;\n    this.backdrop.position.copy(camPos); this.stars.position.copy(camPos);\n    this.backMat.uniforms.uTime.value = this.time;\n    this.tunnelMat.uniforms.uTime.value = this.time;\n    this.tunnel.position.copy(camPos); this.tunnel.quaternion.copy(camQuat);\n    this.tunnelMat.uniforms.uOp.value = this.jumpIntensity;\n    this.tunnelMat.uniforms.uMul.value = 0.4 + this.jumpIntensity * 1.6;\n    this.backMat.uniforms.uB.value = 0.2 + this.jumpIntensity * 2.2;\n    if (this.jumpIntensity > 0.01) {\n      this.backMat.uniforms.c1.value.lerp(this.jc1, 0.1); this.backMat.uniforms.c2.value.lerp(this.jc2, 0.1);\n    }\n    for (const p of this.planets) { p.mat.uniforms.uTime.value = this.time; p.mesh.rotation.y += dt * 0.01; }\n    this.root.traverse((o) => {\n      if (o instanceof THREE.Mesh && o.material instanceof THREE.ShaderMaterial && o.material.uniforms.uIn && o.material.uniforms.uTime) o.material.uniforms.uTime.value = this.time;\n    });\n    if (this.photon) this.photon.position.set(0, 0, 0);\n    if (this.market) this.market.userData.tick?.(this.time);\n  }\n}\n", "/src/game/store.ts": "import { useSyncExternalStore } from 'react';\nimport { BUILDS, BuildKind, ITEMS, ItemId, RECIPES, RES, RES_IDS, ResId } from './data';\nimport { Contract, findPlanet, genContractOffers, stateOf, systemPrice } from './universe';\n\nexport interface Msg { id: number; from: string; text: string; kind: 'sys' | 'client' | 'offer' | 'done'; contractId?: number; planetId?: string }\nexport interface Toast { id: number; text: string; kind: 'info' | 'good' | 'bad' }\nexport interface HotSlot { id: string; label: string; icon: string; count?: number }\nexport interface Flight {\n  speed: number; alt: number; vv: number; throttle: number; warn: string; autoland: boolean;\n  jumpT: number; jumpDur: number; gas: number; hole: number; atmo: boolean; sysState: string; boost: boolean;\n}\nexport interface TFView {\n  name: string; temp: number; atm: number; water: number; g: number; t: number; b: number; bio: boolean;\n  okTemp: boolean; okAtm: boolean; okWater: boolean; okPlants: boolean; ready: boolean; contract: boolean;\n}\n\nexport interface GS {\n  screen: 'menu' | 'play';\n  money: number; res: Record<ResId, number>; items: Partial<Record<ItemId, number>>;\n  parts: string[]; carried: string[]; hasFuelCan: boolean; refueled: boolean; boarded: boolean;\n  fuel: number; maxFuel: number; hull: number; hp: number; oxygen: number; heat: number; breathable: boolean;\n  sysId: number; locName: string; mode: string; shipState: string; planetName: string;\n  offers: Contract[]; contract: Contract | null; claims: string[]; messages: Msg[]; unread: number;\n  panel: null | 'map' | 'shop' | 'fab' | 'screen' | 'pda' | 'help' | 'dialog';\n  shopTab: 'res' | 'tech' | 'tf' | 'svc' | 'village'; screenTab: 'chat' | 'ship' | 'store'; dialog: { name: string; text: string } | null;\n  toasts: Toast[]; hint: string; objective: string; locked: boolean; fx: { kind: string; id: number } | null;\n  flight: Flight | null; tf: TFView | null; hotbar: HotSlot[]; sel: number; progress: number; buildKind: BuildKind;\n  dead: string | null; colonies: number; jumpTarget: number | null; tracked: string | null; capsule: string | null; farm: boolean;\n  scannedNow: boolean; sosAt: number;\n}\n\nconst emptyRes = () => Object.fromEntries(RES_IDS.map((r) => [r, 0])) as Record<ResId, number>;\nexport const initialState = (): GS => ({\n  screen: 'menu', money: 300, res: emptyRes(), items: {},\n  parts: [], carried: [], hasFuelCan: false, refueled: false, boarded: false,\n  fuel: 0, maxFuel: 100, hull: 100, hp: 100, oxygen: 100, heat: 0, breathable: true,\n  sysId: 0, locName: '', mode: 'ground', shipState: 'landed', planetName: '',\n  offers: [], contract: null, claims: [], messages: [], unread: 0,\n  panel: null, shopTab: 'res', screenTab: 'chat', dialog: null,\n  toasts: [], hint: '', objective: '', locked: false, fx: null,\n  flight: null, tf: null, hotbar: [], sel: 0, progress: 0, buildKind: 'house',\n  dead: null, colonies: 0, jumpTarget: null, tracked: null, capsule: null, farm: true, scannedNow: false, sosAt: -1e9,\n});\n\nlet state: GS = initialState();\nconst subs = new Set<() => void>();\nexport const getState = () => state;\nexport function set(p: Partial<GS>) { state = { ...state, ...p }; subs.forEach((f) => f()); }\nexport function reset() { state = initialState(); subs.forEach((f) => f()); }\nexport function useGame(): GS {\n  return useSyncExternalStore((cb) => { subs.add(cb); return () => { subs.delete(cb); }; }, getState);\n}\n\n// мост между UI и движком\nexport const api = {\n  jump: (_id: number) => {}, closePanel: () => {}, lock: () => {}, respawn: () => {}, start: (_quick: boolean) => {},\n  sos: () => {}, capsule: () => {}, getRadar: (): { x: number; z: number; c: string; r: number }[] => [],\n  getShops: (): { id: string; name: string; dist: number }[] => [], useConsumable: (_id: ItemId) => {}, claim: (_id: string, _keep: boolean) => {},\n  openPanel: (_p: GS['panel']) => {}, menu: () => {}, planetInfo: (): any => null,\n};\n\nlet tid = 1, mid = 1;\nexport function toast(text: string, kind: Toast['kind'] = 'info') {\n  const id = tid++;\n  set({ toasts: [...state.toasts.slice(-4), { id, text, kind }] });\n  setTimeout(() => set({ toasts: state.toasts.filter((t) => t.id !== id) }), 4200);\n}\nexport function pushMsg(from: string, text: string, kind: Msg['kind'] = 'client', extra: Partial<Msg> = {}) {\n  set({ messages: [...state.messages.slice(-40), { id: mid++, from, text, kind, ...extra }], unread: state.unread + 1 });\n}\nexport function flash(kind: string) { set({ fx: { kind, id: Math.random() } }); }\n\n// ───────── ресурсы ─────────\nexport const have = (id: ItemId) => (state.items[id] || 0) > 0;\nexport const capacity = () => (have('backpack') ? 450 : 150);\nexport const resTotal = () => RES_IDS.reduce((a, r) => a + state.res[r], 0);\nexport function addRes(id: ResId, n: number, silent = false): number {\n  const free = capacity() - resTotal();\n  const add = Math.max(0, Math.min(n, free));\n  if (add > 0) set({ res: { ...state.res, [id]: state.res[id] + add } });\n  if (add < n && !silent) toast('Хранилище переполнено!', 'bad');\n  return add;\n}\nexport function canPay(cost: Partial<Record<ResId, number>>) {\n  return Object.entries(cost).every(([k, v]) => state.res[k as ResId] >= (v as number));\n}\nexport function pay(cost: Partial<Record<ResId, number>>) {\n  const r = { ...state.res };\n  for (const [k, v] of Object.entries(cost)) r[k as ResId] -= v as number;\n  set({ res: r });\n}\nexport function addItem(id: ItemId, n = 1) { set({ items: { ...state.items, [id]: (state.items[id] || 0) + n } }); }\nexport function takeItem(id: ItemId, n = 1) { set({ items: { ...state.items, [id]: Math.max(0, (state.items[id] || 0) - n) } }); }\n\nexport const sellPrice = (id: ResId, mult = 1) => Math.max(1, Math.round(RES[id].price * 0.8 * mult));\nexport const buyPrice = (id: ResId) => Math.round(RES[id].price * 1.35);\n\nexport function sellRes(id: ResId, n: number, mult = 1) {\n  n = Math.min(n, state.res[id]);\n  if (n <= 0) return;\n  set({ money: state.money + n * sellPrice(id, mult), res: { ...state.res, [id]: state.res[id] - n } });\n}\nexport function buyRes(id: ResId, n: number) {\n  const free = capacity() - resTotal();\n  n = Math.min(n, free, Math.floor(state.money / buyPrice(id)));\n  if (n <= 0) { toast('Недостаточно Спорлингов или места', 'bad'); return; }\n  set({ money: state.money - n * buyPrice(id), res: { ...state.res, [id]: state.res[id] + n } });\n}\nexport function buyItem(id: ItemId) {\n  const it = ITEMS[id];\n  if (state.money < it.price) { toast('Не хватает Спорлингов', 'bad'); return; }\n  if ((it.kind === 'module' || it.kind === 'tool') && have(id)) { toast('Уже установлено', 'info'); return; }\n  set({ money: state.money - it.price });\n  addItem(id);\n  toast(`Куплено: ${it.name}`, 'good');\n}\nexport function craft(idx: number) {\n  const r = RECIPES[idx];\n  if (r.kind === 'item' && (ITEMS[r.id as ItemId].kind === 'tool' || ITEMS[r.id as ItemId].kind === 'module') && have(r.id as ItemId)) { toast('Уже есть', 'info'); return; }\n  if (!canPay(r.cost)) { toast('Не хватает ресурсов', 'bad'); return; }\n  pay(r.cost);\n  if (r.kind === 'item') { addItem(r.id as ItemId, r.out); toast(`Изготовлено: ${ITEMS[r.id as ItemId].name}`, 'good'); }\n  else { addRes(r.id as ResId, r.out, true); toast(`Изготовлено: ${RES[r.id as ResId].name}`, 'good'); }\n}\nexport function canBuild(k: BuildKind) { return have('hammer') && canPay(BUILDS[k].cost); }\n\n// ───────── заказы ─────────\nexport function acceptOffer(id: number) {\n  const o = state.offers.find((x) => x.id === id);\n  if (!o) return;\n  if (state.contract) { toast('Сначала заверши текущий заказ', 'bad'); return; }\n  const c = { ...o, accepted: true };\n  const p = findPlanet(c.planetId)!;\n  set({ contract: c, offers: state.offers.filter((x) => x.id !== id), money: state.money + c.advance });\n  pushMsg(c.client, `Отлично! Планета «${p.name}». Аванс ${c.advance} S уже у вас. После готовности — награда ${c.reward} S.`, 'client');\n  toast(`Заказ принят: ${p.name}`, 'good');\n}\nexport function declineOffer(id: number) { set({ offers: state.offers.filter((x) => x.id !== id) }); }\nexport function refreshOffers() {\n  if (state.offers.length < 2) set({ offers: [...state.offers, ...genContractOffers(2 - state.offers.length, state.sysId)] });\n}\nexport function addClaim(planetId: string) {\n  if (state.claims.includes(planetId)) return;\n  const p = findPlanet(planetId)!;\n  set({ claims: [...state.claims, planetId] });\n  pushMsg('Бортовой ИИ', `Планета «${p.name}» полностью готова к жизни! Сдать заказчику или оставить себе?`, 'done', { planetId });\n  toast(`Планета ${p.name} готова к жизни!`, 'good');\n  flash('good');\n}\nexport function claimPlanet(planetId: string, keep: boolean) {\n  const p = findPlanet(planetId); if (!p) return;\n  const st = stateOf(p);\n  const c = state.contract && state.contract.planetId === planetId ? state.contract : null;\n  st.delivered = true;\n  let money = state.money;\n  if (keep) { st.owned = true; pushMsg('Бортовой ИИ', `«${p.name}» теперь ваш дом! Колония приносит Спорлинги.`, 'sys'); toast('Планета стала вашим домом', 'good'); }\n  else {\n    const rew = c ? c.reward : Math.round(500 * systemPrice(p.sys));\n    money += rew;\n    pushMsg(c ? c.client : 'Покупатель', `Планета принята! Перевод ${rew} S. Спасибо!`, 'client');\n    toast(`+${rew} Спорлингов`, 'good');\n  }\n  set({\n    money, claims: state.claims.filter((x) => x !== planetId), contract: c ? null : state.contract,\n    colonies: state.colonies + (keep ? 1 : 0),\n  });\n  refreshOffers();\n}\n", "/src/game/surface.ts": "import * as THREE from 'three';\nimport { RES, ResId, hash3, mulberry32 } from './data';\nimport { PlanetDef, PState, stateOf } from './universe';\nimport { buildShip } from './models';\nimport { Farm, buildFarm } from './farm';\nimport { glowTexture } from './space';\n\nexport type NodeKind = 'tree' | 'bush' | 'rock' | 'iron' | 'copper' | 'gold' | 'crystal' | 'ice' | 'scrap' | 'loot' | 'npc';\nexport interface SNode {\n  kind: NodeKind; x: number; y: number; z: number; r: number; h: number; hp: number; key: string; solid: boolean; dead: boolean;\n  insts: { mesh: THREE.InstancedMesh; i: number }[]; obj?: THREE.Object3D; label?: string;\n}\ninterface Cell { group: THREE.Group; nodes: SNode[]; creatures: Creature[]; key: string; meshes: THREE.InstancedMesh[]; cx: number; cz: number }\n\nconst NODE_HP: Record<NodeKind, number> = { tree: 3.2, bush: 1.2, rock: 3.5, iron: 5, copper: 5, gold: 7, crystal: 6, ice: 2.  c: number; atm: number; ocean: number }[]> = {\n  alive: [\n    { a: 0x1c4f9c, b: 0x3f9a45, c: 0xdfe9ee, atm: 0x6fb4ff, ocean: 0x1d5fb8 },\n    { a: 0x1b6f86, b: 0x55a65a, c: 0xe8f2f2, atm: 0x74e0ff, ocean: 0x1b8ab0 },\n    { a: 0x5a2d8a, b: 0x8fb54a, c: 0xf2e6f8, atm: 0xd68cff, ocean: 0x6b3aa6 },\n    { a: 0x1c4f9c, b: 0xb88a3d, c: 0xf4efe2, atm: 0xffc47a, ocean: 0x2a6fbf },\n  ],\n  intelligent: [\n    { a: 0x1a4aa8, b: 0x4fa86a, c: 0xeaf0f4, atm: 0x78b8ff, ocean: 0x1e62c8 },\n    { a: 0x1c6a9a, b: 0xa89a58, c: 0xf2f2ec, atm: 0x9bd0ff, ocean: 0x2478b0 },\n  ],\n  dead: [\n    { a: 0x2a2a2e, b: 0x7b7b80, c: 0xc4c4c8, atm: 0xaaaaaa, ocean: 0x2a5fb0 },\n    { a: 0x3a2a22, b: 0x8a6a52, c: 0xcdb299, atm: 0xc89870, ocean: 0x2a5fb0 },\n    { a: 0x3a1c18, b: 0xa04a32, c: 0xe0a080, atm: 0xff9060, ocean: 0x2a5fb0 },\n    { a: 0x20262e, b: 0x586878, c: 0xb0c4d4, atm: 0x9ab8d8, ocean: 0x2a5fb0 },\n  ],\n  deadalive: [\n    { a: 0x3a3022, b: 0x8f7a54, c: 0xd9c8a0, atm: 0xd8b070, ocean: 0x2a5fb0 },\n    { a: 0x2e3436, b: 0x6e7a70, c: 0xb4c0b0, atm: 0xa0c0a8, ocean: 0x2a5fb0 },\n    { a: 0x3a2630, b: 0x8a5a68, c: 0xd8b0bc, atm: 0xe09ab0, ocean: 0x2a5fb0 },\n  ],\n  gas: [\n    { a: 0xc8793a, b: 0xf0d09a, c: 0x8f4a2a, atm: 0xffb070, ocean: 0 },\n    { a: 0x2c5a9c, b: 0x9ad0ff, c: 0x1c3a74, atm: 0x6fb4ff, ocean: 0 },\n    { a: 0xd4b86a, b: 0xf6ecc2, c: 0xa88a48, atm: 0xffe6a0, ocean: 0 },\n    { a: 0x8a4a9a, b: 0xe6b4f0, c: 0x4a2a6a, atm: 0xd68cff, ocean: 0 },\n  ],\n};\n\nfunction genName(r: () => number) {\n  const n = 2 + Math.floor(r() * 2);\n  let s = '';\n  for (let i = 0; i < n; i++) s += SYL[Math.floor(r() * SYL.length)].toLowerCase();\n  s = s[0].toUpperCase() + s.slice(1);\n  return r() < 0.35 ? s + '-' + (1 + Math.floor(r() * 99)) : s;\n}\n\nexport function initUniverse(seed: number) {\n  GAL_SEED = seed;\n  const r = mulberry32(seed);\n  const N = 36;\n  const raw: { x: number; y: number; z: number }[] = [{ x: 0, y: 0, z: 0 }];\n  for (let i = 1; i < N; i++) {\n    const near = i < 7;\n    const rad = near ? 6 + r() * 11 : 18 + r() * 48;\n    const a = r() * Math.PI * 2;\n    raw.push({ x: Math.cos(a) * rad, y: (r() - 0.5) * 10, z: Math.sin(a) * rad });\n  }\n  const order = raw.map((p, i) => ({ i, d: Math.hypot(p.x, p.y, p.z) })).sort((a, b) => a.d - b.d);\n  MARKET_SYS = order[1 + Math.floor(r() * 4)].i;\n  SYSTEMS = raw.map((p, i) => genSystem(i, p, r, i >= 8 && i !== MARKET_SYS && r() < 0.14));\n  SYSTEMS[MARKET_SYS].hasMarket = true;\n  // гарантируем мёртвые планеты в чёрных дырах\n  for (const s of SYSTEMS) if (s.star === 'hole' && !s.planets.some((pl) => pl.type === 'dead' || pl.type === 'deadalive')) {\n    const pl = s.planets[0]; pl.type = 'dead'; pl.atm = 0; pl.temp = -100; pl.water = 0; pl.colors = { ...PAL.dead[0] }; pl.fauna = false; pl.flora = false;\n    pl.res = resFor('dead', r);\n  }\n  for (const k of Object.keys(PSTATES)) delete PSTATES[k];\n}\n\nfunction resFor(t: PType, r: () => number): Partial<Record<ResId, number>> {\n  const j = (v: number) => +(v * (0.6 + r() * 0.8)).toFixed(2);\n  switch (t) {\n    case 'alive': return { wood: j(1), fiber: j(1), stone: j(0.3), water: j(0.6), meat: j(0.5), leather: j(0.4), teeth: j(0.2), copper: j(0.1) };\n    case 'intelligent': return { wood: j(0.8), fiber: j(0.8), stone: j(0.3), water: j(0.6), meat: j(0.4), leather: j(0.4), rope: j(0.3), gold: j(0.1) };\n    case 'dead': return { stone: j(1), iron: j(0.7), copper: j(0.4), gold: j(0.15), crystal: j(0.3), water: j(0.12) };\n    case 'deadalive': return { stone: j(0.6), iron: j(0.9), copper: j(0.7), gold: j(0.25), crystal: j(0.2), rope: j(0.15), teeth: j(0.1), water: j(0.05) };\n    default: return {};\n  }\n}\n\nfunction genSystem(id: number, p: { x: number; y: number; z: number }, gr: () => number, hole: boolean): SystemDef {\n  const seed = Math.floor(gr() * 1e9);\n  const r = mulberry32(seed);\n  const name = id === 0 ? 'Солнечный Приют' : genName(r);\n  const colors = [0xfff1c0, 0xffd27a, 0xffa860, 0xaad0ff, 0xf os: V3T, moon: boolean, parent: number, r: () => number, home: boolean): PlanetDef {\n  const pal = home ? PAL.alive[0] : PAL[type][Math.floor(r() * PAL[type].length)];\n  let radius = 320 + r() * 560, atm = 0, temp = 0, water = 0, gravity = 9;\n  switch (type) {\n    case 'alive': case 'intelligent': atm = 0.85 + r() * 0.3; temp = 8 + r() * 22; water = 30 + r() * 40; gravity = 8 + r() * 3; break;\n    case 'dead': atm = r() < 0.6 ? 0 : 0.05 + r() * 0.3; temp = -150 + r() * 300; water = 0; gravity = 2.5 + r() * 5; break;\n    case 'deadalive': atm = r() < 0.4 ? 0 : 0.05 + r() * 0.45; temp = -80 + r() * 140; water = r() * 4; gravity = 4 + r() * 5; break;\n    case 'gas': radius = 900 + r() * 700; atm = 3; temp = -150 + r() * 250; gravity = 22; break;\n  }\n  if (moon) { radius = 90 + r() * 90; gravity = 1.2 + r() * 1.6; atm = r() < 0.8 ? 0 : 0.05; }\n  if (home) { radius = 520; atm = 1; temp = 19; water = 48; gravity = 9.8; }\n  const nm = home ? 'Родина' : sname + ' ' + ROMAN[idx % ROMAN.length] + (moon ? ' (спутник)' : '');\n  return {\n    id: sys + ':' + idx, sys, idx, name: nm, type, moon, parent, radius, pos, atm, temp, water, gravity,\n    seed: Math.floor(r() * 1e6), colors: { ...pal }, res: resFor(type, r),\n    fauna: type === 'alive' || type === 'intelligent' || type === 'deadalive', flora: type === 'alive' || type === 'intelligent',\n    ruins: type === 'deadalive' || type === 'intelligent', home, hasRings: type === 'gas' && r() < 0.4,\n    flowerHue: [0.33, 0.28, 0.9, 0.08, 0.55].sort(() => r() - 0.5).slice(0, 3),\n  };\n}\n\nexport function getSystem(id: number) { return SYSTEMS[id]; }\nexport function marketSystem() { return SYSTEMS[MARKET_SYS]; }\nexport function distLy(a: number, b: number) {\n  const A = SYSTEMS[a], B = SYSTEMS[b];\n  return Math.hypot(A.gx - B.gx, A.gy - B.gy, A.gz - B.gz);\n}\nexport function jumpCost(a: number, b: number) { return Math.max(3, Math.ceil(distLy(a, b) * 1.2)); }\nexport function findPlanet(id: string): PlanetDef | u ices.length || s.ready) continue;\n    let h = 0, c = 0, ag = 0, ad = 0, wg = 0, wd = 0;\n    for (const d of s.devices) {\n      if (d.k === 'heater') h++; else if (d.k === 'cooler') c++; else if (d.k === 'atmgen') ag++;\n      else if (d.k === 'atmdes') ad++; else if (d.k === 'watergen') wg++; else if (d.k === 'drier') wd++;\n    }\n    s.temp = Math.max(-200, Math.min(400, s.temp + (h - c) * 1.5 * dt));\n    s.atm = Math.max(0, Math.min(3, s.atm + (ag - ad) * 0.015 * dt));\n    s.water = Math.max(0, Math.min(100, s.water + (wg - wd) * 0.7 * dt));\n    if (tfStatus(s).all) { s.ready = true; const p = findPlanet(id); if (p) done.push(p); }\n  }\n  return done;\n}\n\n// ───────── заказы ─────────\nexport interface Contract { id: number; client: string; planetId: string; reward: number; advance: number; accepted: boolean; done: boolean }\nconst CLIENTS = ['Корпорация «Аркадия»', 'Колонисты Нова-Терра', 'Фонд «Второй дом»', 'Семья Орловых', 'Гильдия Стрельцов', 'Сеть «Эдем Лтд»', 'Академия Звёздных Садов'];\nlet cid = 1;\nexport function genContractOffers(n: number, fromSys: number): Contract[] {\n  const cands: PlanetDef[] = [];\n  for (const s of SYSTEMS) {\n    if (s.id === 0) continue;\n    for (const p of s.planets) if ((p.type === 'dead' || p.type === 'deadalive') && !stateOf(p).delivered && !stateOf(p).owned) cands.push(p);\n  }\n  const out: Contract[] = [];\n  const r = Math.random;\n  const near = cands.filter((p) => distLy(0, p.sys) < 30);\n  for (let i = 0; i < n && cands.length; i++) {\n    const pool = i === 0 && near.length ? near : cands;\n    const p = pool[Math.floor(r() * pool.length)];\n    if (out.some((o) => o.planetId === p.id)) continue;\n    const mult = systemPrice(p.sys);\n    const base = 1200 + distLy(fromSys, p.sys) * 28 + (p.moon ? 0 : 300);\n    out.push({\n      id: cid++, client: CLIENTS[Math.floor(r() * CLIENTS.length)], planetId: p.id,\n      reward: Math.round((base * mult) / 50) * 50, advance: mult > 1 ? 0 : 300, accepted: false,
